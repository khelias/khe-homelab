# Broker for the house: Home Assistant, PAI (Paradox alarm) and later
# Zigbee2MQTT. Reachable only on the internal proxy network - the stack
# publishes no host port, so nothing outside Docker can talk to it.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
