services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      # Both mounted read-only so the container never rewrites repo files.
      # The image's entrypoint chowns /mosquitto/config to uid 1883 at start
      # and that chown fails on a read-only mount, so passwd must already be
      # owned by 1883 on the host or the broker cannot read its own password
      # file: sudo chown 1883:1883 services/home/mosquitto/config/passwd
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/passwd:/mosquitto/config/passwd:ro
      - ./data:/mosquitto/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
    # Checks the listening socket without opening a connection. A connecting
    # probe (nc, mosquitto_sub) works too, but every probe logs a connect and
    # a disconnect at notice level, which Alloy then ships to Loki twice a
    # minute forever. A protocol-level check would also need broker
    # credentials in this container; real end-to-end liveness belongs in the
    # Uptime Kuma MQTT monitor instead.
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':1883' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  proxy:
    external: true
