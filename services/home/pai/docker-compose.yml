services:
  pai:
    image: paradoxalarminterface/pai:3.8.1@sha256:9bd5055263ae007f5a2a65e65f2968463cf0c7f238b9c7aedbaa4bfb1b8268b8
    container_name: pai
    restart: unless-stopped
    environment:
      - TZ=Europe/Tallinn
      - PAI_CONFIG_FILE=/etc/pai/pai.conf
    volumes:
      - ./config/pai.conf:/etc/pai/pai.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-internal
    # No healthcheck (docs/operational-notes.md#healthchecks).
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  home-internal:
    external: true
