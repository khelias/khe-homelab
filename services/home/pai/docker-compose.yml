services:
  pai:
    image: paradoxalarminterface/pai:3.8.1@sha256:9bd5055263ae007f5a2a65e65f2968463cf0c7f238b9c7aedbaa4bfb1b8268b8
    container_name: pai
    restart: unless-stopped
    environment:
      - TZ=Europe/Tallinn
      - PAI_CONFIG_FILE=/etc/pai/pai.conf
    volumes:
      - ./config/pai.conf:/etc/pai/pai.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
    # Process-level only: this catches a dead PAI, not a dropped panel or
    # broker connection. PAI reconnects on its own, and the real signal is the
    # alarm entities going unavailable in Home Assistant.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'paradox' >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  proxy:
    external: true
