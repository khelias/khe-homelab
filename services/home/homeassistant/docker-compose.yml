services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Tallinn
    # khe-home-assistant's deploy writes configuration.yaml, packages/,
    # tuya_local_devices/ and www/house3d/ into ha_config. A named volume on
    # the VM's local disk, not /srv/data, because the recorder is SQLite.
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'

volumes:
  ha_config:

networks:
  proxy:
    external: true
