services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Tallinn
    # khe-home-assistant's deploy writes configuration.yaml, packages/,
    # tuya_local_devices/ and www/house3d/ into ha_config. A named volume on
    # the VM's local disk, not /srv/data, because the recorder is SQLite.
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    # proxy stays the default gateway; home-internal is only for MQTT.
    networks:
      proxy:
        gw_priority: 1
      home-internal: {}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'

volumes:
  ha_config:

networks:
  proxy:
    external: true
  home-internal:
    external: true
