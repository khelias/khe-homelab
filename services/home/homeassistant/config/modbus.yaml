# Komfovent C6 ventilation unit over Modbus TCP, read-only.
# Register map measured against the live unit (2026-09-08, re-read 2026-09-12);
# traps and the reasoning are in docs/home-assistant-plan.md, phase 3.
# Not mapped on purpose: 904 (0x8000 = sensor absent) and 905-908 (flow control
# is OFF, so those "m3/h" fields carry nothing meaningful).
- name: komfovent
  type: tcp
  host: 192.168.0.155
  port: 502
  timeout: 5
  # The controller drops connections that arrive in quick succession.
  message_wait_milliseconds: 100
  sensors:
    - name: Komfovent supply temperature
      unique_id: komfovent_supply_temperature
      address: 901
      data_type: int16
      scale: 0.1
      precision: 1
      unit_of_measurement: °C
      device_class: temperature
      state_class: measurement
      scan_interval: 30
    - name: Komfovent extract temperature
      unique_id: komfovent_extract_temperature
      address: 902
      data_type: int16
      scale: 0.1
      precision: 1
      unit_of_measurement: °C
      device_class: temperature
      state_class: measurement
      scan_interval: 30
    - name: Komfovent outdoor temperature
      unique_id: komfovent_outdoor_temperature
      address: 903
      data_type: int16
      scale: 0.1
      precision: 1
      unit_of_measurement: °C
      device_class: temperature
      state_class: measurement
      scan_interval: 30
    - name: Komfovent filter contamination
      unique_id: komfovent_filter_contamination
      address: 916
      data_type: uint16
      unit_of_measurement: "%"
      state_class: measurement
      scan_interval: 300
    - name: Komfovent power
      unique_id: komfovent_power
      address: 920
      data_type: uint16
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      scan_interval: 30
    - name: Komfovent heat exchanger efficiency
      unique_id: komfovent_heat_exchanger_efficiency
      address: 923
      data_type: uint16
      unit_of_measurement: "%"
      state_class: measurement
      scan_interval: 30
    # uint32 spans 930-931 and is read as one aligned two-register request;
    # a single-register read of either half returns Modbus exception 3.
    - name: Komfovent total energy
      unique_id: komfovent_total_energy
      address: 930
      data_type: uint32
      scale: 0.001
      precision: 3
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      scan_interval: 60
