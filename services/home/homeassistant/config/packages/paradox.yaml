# Paradox SP6000 through PAI. Zone 1 is the house smoke detectors, wired into
# the panel. With the monitoring contract ended they sound locally and reach
# nobody, so this automation is the only thing that carries a fire out of the
# building.
#
# Standing rule from the HA plan: automations notify, they do not write. This
# one deliberately does not disarm, unlock or call anything.
#
# The trigger is `to: "on"` without a `from`, so a zone coming back from
# unavailable still fires. For fire that asymmetry is the right one: a
# duplicate alert costs a glance, a missed one costs the house.

automation:
  - alias: "Valve: tulekahju"
    id: paradox_alert_smoke
    description: "Suitsuandurite tsoon läheb tööle."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.suitsuandurid
        to: "on"
    actions:
      - action: notify.notify
        data:
          title: "TULEKAHJU"
          message: >
            Suitsuandurid on tööle läinud.
            Maja {{ states('alarm_control_panel.maja') }},
            garaaž {{ states('alarm_control_panel.garaaz') }}.
          data:
            # iOS critical alert: rings through silent mode and a focus.
            # Needs "Critical Alerts" allowed once per phone in the companion
            # app, otherwise it arrives as an ordinary notification.
            tag: tulekahju
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
            interruption-level: critical

# Two aggregates so the dashboard never has to grow or shrink a card to say
# something changed. A layout that reflows every time a PIR fires is unusable,
# and 14 tamper tiles that are almost always off is not a dashboard either.

  - alias: "Valve: häire"
    id: paradox_alert_triggered
    description: "Partitsioon läks häiresse."
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - alarm_control_panel.maja
          - alarm_control_panel.garaaz
        to: "triggered"
    actions:
      - action: notify.notify
        data:
          title: "HÄIRE"
          message: >
            {% set active = expand(
                 'binary_sensor.peauks', 'binary_sensor.elutoa_uks', 'binary_sensor.vannitoa_uks',
                 'binary_sensor.kook_liikumine', 'binary_sensor.elutuba_liikumine',
                 'binary_sensor.koridor_liikumine', 'binary_sensor.garaaz_liikumine',
                 'binary_sensor.tehnoruum_liikumine', 'binary_sensor.vanemate_tuba_liikumine',
                 'binary_sensor.magamistuba_2', 'binary_sensor.magamistuba_4',
                 'binary_sensor.kontor_liikumine', 'binary_sensor.suitsuandurid'
               ) | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
            {{ trigger.to_state.attributes.friendly_name }} läks häiresse.
            {% if active %}Aktiivsed: {{ active | join(', ') }}.
            {% else %}Ükski tsoon ei ole hetkel aktiivne.{% endif %}
          data:
            tag: valve_haire
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
            interruption-level: critical

  # The panel decides what an intrusion is, not this file. Its zone config
  # already knows which sensors are pet-immune and which are bypassed while
  # someone sleeps, so watching a single PIR here would fight it and would
  # fire on the dog. The panel going to `triggered` is the whole signal.

  - alias: "Valve: toide akult"
    id: paradox_alert_battery
    description: "Aku pinge langes, ehk võrgutoide on kadunud või aku on nõrk."
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.valve_aku
        below: 12.5
        for: "00:10:00"
    actions:
      - action: notify.notify
        data:
          title: "Valve: toide"
          message: >
            Valvepaneeli aku {{ states('sensor.valve_aku') }} V, tavaliselt 13,8 V.
            Kas võrgutoide on kadunud või aku ei pea enam laengut.
          data:
            tag: valve_aku

  - alias: "Valve: andurit rikutakse"
    id: paradox_alert_tamper
    description: "Mõne anduri korpus on avatud või juhe lahti."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.valve_rikkumine
        to: "on"
        for: "00:00:30"
    actions:
      - action: notify.notify
        data:
          title: "Valve: rikkumine"
          message: >
            {% set t = states.binary_sensor
                 | selectattr('entity_id', 'search', '_rikkumine$')
                 | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
            {{ t | join(', ') if t else 'Tundmatu andur' }}.
            Korpus avatud või juhe lahti.
          data:
            tag: valve_rikkumine

  # The keypad's Paanika button raises one of three panics, and the panel
  # publishes each as its own partition flag. A silent panic deliberately does
  # not sound the siren and may not move the partition to `triggered`, so the
  # state-based automation above would miss exactly the case where somebody
  # pressed the button on purpose and cannot shout. Before the monitoring
  # contract ended a silent panic went to the centre; now it goes here.
  # Same notification tag as the alarm, so a panic that also trips the siren
  # collapses into one notification instead of two.
  - alias: "Valve: paanikanupp"
    id: paradox_alert_panic
    description: "Vaikne, meditsiiniline või tulekahju paanika klahvistikult."
    mode: single
    triggers:
      - trigger: mqtt
        topic: "paradox/states/partitions/+/silent_alarm"
        payload: "True"
      - trigger: mqtt
        topic: "paradox/states/partitions/+/paramedic_alarm"
        payload: "True"
      - trigger: mqtt
        topic: "paradox/states/partitions/+/pulse_fire_alarm"
        payload: "True"
    actions:
      - action: notify.notify
        data:
          title: "PAANIKANUPP"
          message: >
            {% set part = trigger.topic.split('/')[3] %}
            {% set kind = trigger.topic.split('/')[4] %}
            {{ {'silent_alarm': 'Vaikne häire',
                'paramedic_alarm': 'Meditsiiniline abikutse',
                'pulse_fire_alarm': 'Tulekahju'}.get(kind, kind) }}
            partitsioonis {{ part }}. Keegi vajutas klahvistikul paanikanuppu.
          data:
            tag: valve_haire
            push:
              sound:
                name: default
                critical: 1
                volume: 1.0
            interruption-level: critical

template:
  - binary_sensor:
      - name: "Valve rikkumine"
        unique_id: paradox_tamper_any
        device_class: tamper
        state: >
          {{ expand(
               'binary_sensor.suitsuandurid_rikkumine', 'binary_sensor.valissireen_rikkumine',
               'binary_sensor.peauks_rikkumine', 'binary_sensor.elutoa_uks_rikkumine',
               'binary_sensor.vannitoa_uks_rikkumine',
               'binary_sensor.vanemate_tuba_rikkumine', 'binary_sensor.magamistuba_2_rikkumine',
               'binary_sensor.kontor_rikkumine', 'binary_sensor.magamistuba_4_rikkumine',
               'binary_sensor.kook_liikumine_rikkumine', 'binary_sensor.elutuba_liikumine_rikkumine',
               'binary_sensor.koridor_liikumine_rikkumine', 'binary_sensor.garaaz_liikumine_rikkumine',
               'binary_sensor.tehnoruum_liikumine_rikkumine'
             ) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      # PAI reports its link as the raw word "online"; as a connectivity sensor the
      # frontend says Ühendatud / Lahti ühendatud. The badge still watches the raw one.
      - name: "Valve ühendus"
        unique_id: paradox_connection
        device_class: connectivity
        state: "{{ is_state('sensor.valve_uhendus', 'online') }}"
