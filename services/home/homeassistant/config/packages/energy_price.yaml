# One digest a day, when tomorrow's prices land (~14:00 EET). Triggered off the
# forecast sensor rather than the Nord Pool flag so the attribute is already
# rebuilt when this reads it; `from` keeps a restart from re-sending it. The tag
# makes each day's message replace the previous one instead of stacking.
automation:
  - alias: "Elekter: homsed hinnad"
    id: khe_price_tomorrow_digest
    description: "Tänase päeva järelejäänud osa ja homne: odavaimad 3 h aknad, homne keskmine tänase vastu, kalleim tund."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.elektri_hinna_prognoos
        from: "ainult täna"
        to: "täna ja homme"
    # the trigger only says tomorrow exists, not that it is a whole day; without
    # this a partial publication would push an empty message (the message body
    # guards the same way, so a manual run renders nothing rather than garbage)
    # the sensor's own availability is the authority on "tomorrow is a whole day"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.homme_elekter') }}"
    actions:
      - variables:
          teade: >
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {#- today's half only: tomorrow's summary comes from sensor.homme_elekter,
                so the card and this message cannot drift apart -#}
            {%- set esimene = (today_at('06:00') | as_timestamp) | int -%}
            {%- set viimane = (today_at('21:00') | as_timestamp) | int -%}
            {%- set rows = all | selectattr('s', 'ge', [h, esimene] | max) | selectattr('s', 'lt', viimane + 4 * 3600) | list -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - 3) -%}
              {%- set win = rows[i:i + 4] -%}
              {%- if win[0].s <= viimane and win[-1].s - win[0].s == 3 * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / 4 -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {% if ns.best %}Täna veel parim 4 h aken {{ ns.best | timestamp_custom('%H:%M', true) }}-{{ (ns.best + 14400) | timestamp_custom('%H:%M', true) }}, {{ ('%.1f' | format(ns.avg * 100)).replace('.', ',') }} s/kWh.{% else %}Täna 4 h akent enam ei mahu.{% endif %}
            {{ state_attr('sensor.homme_elekter', 'tekst') }}
      - action: persistent_notification.create
        data:
          title: "Elektri hinnad"
          notification_id: elektri_hind
          message: "{{ teade }}"
      - action: notify.notify
        data:
          title: "Elektri hinnad"
          message: "{{ teade }}"
          data:
            tag: elektri_hind
            clickAction: /lovelace/kodu
            url: /lovelace/kodu

recorder:
  exclude:
    entities:
      - sensor.elektri_hinna_prognoos
