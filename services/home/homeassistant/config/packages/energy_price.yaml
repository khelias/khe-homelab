# Real electricity price per kWh, incl. VAT, on top of the raw Nord Pool spot.
# Tariff constants are the published Estonian grid, renewable, security-of-supply
# and excise components plus the supplier margin, all excl. VAT unless noted.
# Update them from the current invoice when it changes; which package, fuse size
# and supplier they were taken from is recorded in khe-meta's house docs, not
# here. Monthly fixed fees are deliberately left out - they do not move with
# consumption. The supplier margin is quoted incl. VAT, so it is added after
# the VAT multiplication.
#
# Day tariff: Mon-Fri 07:00-22:00 Estonian time, excluding public holidays.
# Night: everything else. Public holidays come from the core `workday`
# integration (binary_sensor.workday_sensor_ee, country EE, added via the UI 2026-09-12).
template:
  - binary_sensor:
      - name: "Võrgu öötariif"
        unique_id: grid_night_tariff
        icon: mdi:weather-night
        state: >
          {% set h = now().hour %}
          {{ h < 7 or h >= 22 or is_state('binary_sensor.workday_sensor_ee', 'off') }}

  - sensor:
      - name: "Elektri hind kokku"
        unique_id: electricity_price_total
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-multiple
        availability: "{{ has_value('sensor.nord_pool_ee_praegune_hind') }}"
        state: >
          {% set spot = states('sensor.nord_pool_ee_praegune_hind') | float %}
          {% set grid = 0.021 if is_state('binary_sensor.vorgu_ootariif', 'on') else 0.0369 %}
          {# renewable 0.0084 + security of supply 0.00758 + excise 0.0021 + supplier balancing 0.00373 #}
          {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
          {{ ((spot + grid + fees) * 1.24 + 0.0047) | round(5) }}
        attributes:
          spot_excl_vat: "{{ states('sensor.nord_pool_ee_praegune_hind') | float(0) }}"
          grid_tariff: "{{ 'öö' if is_state('binary_sensor.vorgu_ootariif', 'on') else 'päev' }}"

      - name: "Elektri hind kokku, järgmine"
        unique_id: electricity_price_total_next
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-clock
        availability: "{{ has_value('sensor.nord_pool_ee_jargmine_hind') }}"
        state: >
          {% set spot = states('sensor.nord_pool_ee_jargmine_hind') | float %}
          {% set t = now() + timedelta(minutes=15) %}
          {% set night = t.hour < 7 or t.hour >= 22 or is_state('binary_sensor.workday_sensor_ee', 'off') %}
          {% set grid = 0.021 if night else 0.0369 %}
          {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
          {{ ((spot + grid + fees) * 1.24 + 0.0047) | round(5) }}

  # Forecast for the chart: today's and tomorrow's prices, averaged per hour
  # (the house has an hourly meter, so the hourly mean is what gets billed),
  # with the same tariff stack applied per hour. Refreshed hourly, when tomorrow's
  # prices arrive (~14:00 EET) and at startup. Attribute keys are short and
  # the start is an epoch second, 48 points stay far under the 16 KB attribute cap;
  # the entity is excluded from the recorder below because it changes every
  # refresh and its history has no value.
  - triggers:
      - trigger: time_pattern
        minutes: "3"
      - trigger: state
        entity_id: binary_sensor.nord_pool_ee_homne_hind_on_saadaval
        to: "on"
      - trigger: homeassistant
        event: start
      # manual refresh after a package deploy: POST /api/events/khe_price_refresh
      - trigger: event
        event_type: khe_price_refresh
    actions:
      - action: nordpool.get_prices_for_date
        data:
          config_entry: 01M2AVBYMY0JB85Z9EM2D22QET
          date: "{{ now().date() }}"
          areas: [EE]
          currency: EUR
        response_variable: today
      - action: nordpool.get_prices_for_date
        continue_on_error: true
        data:
          config_entry: 01M2AVBYMY0JB85Z9EM2D22QET
          date: "{{ (now() + timedelta(days=1)).date() }}"
          areas: [EE]
          currency: EUR
        response_variable: tomorrow
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_ee
        data:
          check_date: "{{ now().date() }}"
        response_variable: wd_today
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_ee
        data:
          check_date: "{{ (now() + timedelta(days=1)).date() }}"
        response_variable: wd_tomorrow
    sensor:
      - name: "Elektri hinna prognoos"
        unique_id: electricity_price_forecast
        icon: mdi:chart-timeline-variant
        state: >
          {% set tmr = tomorrow.EE if tomorrow is defined and tomorrow.EE is defined else [] %}
          {{ 'täna ja homme' if tmr | count > 0 else 'ainult täna' }}
        attributes:
          prices: >
            {% set ns = namespace(out=[]) %}
            {% set tmr = tomorrow.EE if tomorrow is defined and tomorrow.EE is defined else [] %}
            {% set wdt = wd_today['binary_sensor.workday_sensor_ee'].workday %}
            {% set wdm = wd_tomorrow['binary_sensor.workday_sensor_ee'].workday %}
            {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
            {# hourly meter: billing uses the plain average of the four 15-min prices, so average per hour #}
            {% for slots in (today.EE + tmr) | batch(4) %}
              {% set spot = (slots | map(attribute='price') | sum) / (slots | count) / 1000 %}
              {% set t = as_local(as_datetime(slots[0].start)) %}
              {% set wd = wdt if t.date() == now().date() else wdm %}
              {% set grid = 0.021 if (t.hour < 7 or t.hour >= 22 or not wd) else 0.0369 %}
              {% set ns.out = ns.out + [{'s': as_timestamp(slots[0].start) | int, 'p': spot | round(4), 't': ((spot + grid + fees) * 1.24 + 0.0047) | round(4)}] %}
            {% endfor %}
            {{ ns.out }}

  # Hourly view of the same stack for the dashboard row "previous / this /
  # next hour", read from the forecast attribute so all three agree with the
  # chart and with what the hourly meter is billed at.
  - sensor:
      - name: "Elektri hind, eelmine tund"
        unique_id: electricity_price_hour_prev
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-minus
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600 - 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}
      - name: "Elektri hind, see tund"
        unique_id: electricity_price_hour_now
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-multiple
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}
      - name: "Elektri hind, järgmine tund"
        unique_id: electricity_price_hour_next
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-plus
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600 + 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}

  # Human-readable "is it expensive right now" and the cheapest window for a
  # load you can move (laundry, sauna). Two different price bases on purpose:
  #
  # The LEVEL is classified on the bare spot price incl. VAT, because the band
  # edges below are elektrikell.ee's published thresholds (Gridio derives them
  # server-side from two years of EE spot history). We have no comparable
  # history for the full tariffed price, so bands on that number would be
  # invented. It also keeps the figure comparable with the site the household
  # already reads.
  #
  # The WINDOW search runs on the full billed price `t`, because the grid
  # tariff is time-of-use here: night is 1.6 c/kWh cheaper excl. VAT, which
  # genuinely reorders the hours around 22:00 and 07:00. Optimising on spot
  # alone would pick the wrong window there.
  - triggers:
      - trigger: time_pattern
        minutes: "4"
      - trigger: state
        entity_id: sensor.elektri_hinna_prognoos
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: khe_price_refresh
    sensor:
      - name: "Elektri hinna tase"
        unique_id: electricity_price_level
        icon: mdi:gauge
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {% if m %}
            {% set c = m[0].p * 124 %}
            {{ 'väga odav' if c < 0.26 else 'odav' if c < 2.48 else 'keskmine' if c < 8.51 else 'kõrgevõitu' if c < 14.83 else 'kallis' if c < 27.51 else 'väga kallis' }}
          {% endif %}
        attributes:
          # spot incl. VAT, the number elektrikell.ee shows
          senti: >
            {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
            {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
            {{ (m[0].p * 124) | round(2) if m else none }}
          # what the invoice actually charges for this hour
          arvel: >
            {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
            {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
            {{ (m[0].t * 100) | round(1) if m else none }}
          # position within today, so a cheap day does not read the same as a cheap hour
          vordlus: >
            {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
            {% set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') %}
            {% set today = all | selectattr('s', 'ge', (today_at('00:00') | as_timestamp) | int)
                               | selectattr('s', 'lt', (today_at('00:00') | as_timestamp) | int + 86400) | list %}
            {% set m = all | selectattr('s', 'eq', h) | list %}
            {% if m and today | count > 0 %}
              {% set avg = (today | map(attribute='p') | sum) / (today | count) %}
              {{ ((m[0].p - avg) / avg * 100) | round(0) | int if avg > 0 else 0 }}
            {% endif %}
          # the level word alone reads as a verdict ("Kallis" = do nothing), which is
          # wrong when the hour is the cheap end of an expensive day. Absolute band
          # and position within the day belong in one sentence, and "aga" carries
          # the case where the two disagree.
          hinnang: >
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') -%}
            {%- set m = all | selectattr('s', 'eq', h) | list -%}
            {%- set paev = all | selectattr('s', 'ge', (today_at('00:00') | as_timestamp) | int)
                               | selectattr('s', 'lt', (today_at('00:00') | as_timestamp) | int + 86400) | list -%}
            {%- if m and paev | count > 0 -%}
              {%- set avg = (paev | map(attribute='p') | sum) / (paev | count) -%}
              {%- set c = m[0].p * 124 -%}
              {%- set tase = 'väga odav' if c < 0.26 else 'odav' if c < 2.48 else 'keskmine' if c < 8.51 else 'kõrgevõitu' if c < 14.83 else 'kallis' if c < 27.51 else 'väga kallis' -%}
              {%- set d = ((m[0].p - avg) / avg * 100) | round(0) | int if avg > 0 else 0 -%}
              {%- set pos = 'tänase odavaim ots' if d <= -25 else 'alla päeva keskmise' if d <= -10 else 'tänane keskmine' if d < 10 else 'üle päeva keskmise' if d < 25 else 'tänase kalleim ots' -%}
              {%- set vastuolu = (c >= 8.51 and d <= -10) or (c < 2.48 and d >= 10) -%}
              {{ tase | capitalize }}{{ ', aga' if vastuolu else ' ja' }} {{ pos }}
            {%- endif -%}
          tekst: >
            {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
            {% set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') %}
            {% set m = all | selectattr('s', 'eq', h) | list %}
            {% set today = all | selectattr('s', 'ge', (today_at('00:00') | as_timestamp) | int)
                               | selectattr('s', 'lt', (today_at('00:00') | as_timestamp) | int + 86400) | list %}
            {% if m and today | count > 0 %}
              {% set avg = (today | map(attribute='p') | sum) / (today | count) %}
              {% set d = ((m[0].p - avg) / avg * 100) | round(0) | int if avg > 0 else 0 %}
              {% set senti = ('%.1f' | format(m[0].p * 124)).replace('.', ',') %}
              {% set arvel = ('%.1f' | format(m[0].t * 100)).replace('.', ',') %}
              Börs {{ senti }} s/kWh ({{ '+' if d > 0 else '' }}{{ d }}%), arvel {{ arvel }} s/kWh.
            {% endif %}

      - name: "Odavaim aken, 2 h"
        unique_id: cheapest_window_2h
        device_class: timestamp
        icon: mdi:washing-machine
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {%- set n = 2 -%}
          {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
          {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
          {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
          {%- set ns = namespace(best=none, avg=none) -%}
          {%- for i in range(rows | count - n + 1) -%}
            {%- set win = rows[i:i + n] -%}
            {#- a window must be contiguous: n hours span exactly n-1 hours -#}
            {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
              {%- set a = (win | map(attribute='t') | sum) / n -%}
              {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set nowwin = rows[0:n] -%}
          {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
          {{ ns.best | timestamp_custom('%Y-%m-%dT%H:%M:%S%z', true) if ns.best else none }}
        attributes:
          lopp: >
            {%- set n = 2 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ (ns.best + n * 3600) | timestamp_custom('%H:%M', true) if ns.best else none }}
          keskmine: >
            {%- set n = 2 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ (ns.avg * 100) | round(1) if ns.avg else none }}
          vahe: >
            {%- set n = 2 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ ((base - ns.avg) / base * 100) | round(0) | int if base and ns.avg and base > 0 else none }}
          tekst: >
            {%- set n = 2 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {%- if ns.best -%}
              {%- set algus = ns.best | timestamp_custom('%H:%M', true) -%}
              {%- set lopp = (ns.best + n * 3600) | timestamp_custom('%H:%M', true) -%}
              {%- set homme = (ns.best | timestamp_custom('%Y-%m-%d', true)) != now().strftime('%Y-%m-%d') -%}
              {%- set hind = ('%.1f' | format(ns.avg * 100)).replace('.', ',') -%}
              {%- set d = ((base - ns.avg) / base * 100) | round(0) | int if base and base > 0 else 0 -%}
              {%- if ns.best == h -%}
                {#- "now is cheapest" reads as a recommendation; when it is the only candidate left it is not one -#}
                {%- if rows | count - n + 1 > 1 -%}
                  Praegu, keskmine {{ hind }} s/kWh.
                {%- else -%}
                  Paremat ei tule, keskmine {{ hind }} s/kWh.
                {%- endif -%}
              {%- else -%}
                {{ 'Homme' if homme else 'Kell' }} {{ algus }}-{{ lopp }}, keskmine {{ hind }} s/kWh{% if d > 0 %}, {{ d }}% odavam kui praegu alustades{% endif %}.
              {%- endif -%}
            {%- else -%}
              Homseid hindu veel ei ole.
            {%- endif -%}
      - name: "Odavaim aken, 3 h"
        unique_id: cheapest_window_3h
        device_class: timestamp
        icon: mdi:hot-tub
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {%- set n = 3 -%}
          {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
          {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
          {%- set dayend = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
          {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', dayend) | list -%}
          {%- if rows | count < n -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
          {%- endif -%}
          {%- set ns = namespace(best=none, avg=none) -%}
          {%- for i in range(rows | count - n + 1) -%}
            {%- set win = rows[i:i + n] -%}
            {#- a window must be contiguous: n hours span exactly n-1 hours -#}
            {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
              {%- set a = (win | map(attribute='t') | sum) / n -%}
              {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set nowwin = rows[0:n] -%}
          {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
          {{ ns.best | timestamp_custom('%Y-%m-%dT%H:%M:%S%z', true) if ns.best else none }}
        attributes:
          lopp: >
            {%- set n = 3 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set dayend = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', dayend) | list -%}
            {%- if rows | count < n -%}
              {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- endif -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ (ns.best + n * 3600) | timestamp_custom('%H:%M', true) if ns.best else none }}
          keskmine: >
            {%- set n = 3 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set dayend = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', dayend) | list -%}
            {%- if rows | count < n -%}
              {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- endif -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ (ns.avg * 100) | round(1) if ns.avg else none }}
          vahe: >
            {%- set n = 3 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set dayend = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', dayend) | list -%}
            {%- if rows | count < n -%}
              {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- endif -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {{ ((base - ns.avg) / base * 100) | round(0) | int if base and ns.avg and base > 0 else none }}
          tekst: >
            {%- set n = 3 -%}
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set dayend = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
            {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', dayend) | list -%}
            {%- if rows | count < n -%}
              {%- set rows = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', h + 86400) | list -%}
            {%- endif -%}
            {%- set ns = namespace(best=none, avg=none) -%}
            {%- for i in range(rows | count - n + 1) -%}
              {%- set win = rows[i:i + n] -%}
              {#- a window must be contiguous: n hours span exactly n-1 hours -#}
              {%- if win[-1].s - win[0].s == (n - 1) * 3600 -%}
                {%- set a = (win | map(attribute='t') | sum) / n -%}
                {%- if ns.avg is none or a < ns.avg -%}{%- set ns.avg = a -%}{%- set ns.best = win[0].s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set nowwin = rows[0:n] -%}
            {%- set base = (nowwin | map(attribute='t') | sum) / n if nowwin | count == n and nowwin[-1].s - nowwin[0].s == (n - 1) * 3600 else none -%}
            {%- if ns.best -%}
              {%- set algus = ns.best | timestamp_custom('%H:%M', true) -%}
              {%- set lopp = (ns.best + n * 3600) | timestamp_custom('%H:%M', true) -%}
              {%- set homme = (ns.best | timestamp_custom('%Y-%m-%d', true)) != now().strftime('%Y-%m-%d') -%}
              {%- set hind = ('%.1f' | format(ns.avg * 100)).replace('.', ',') -%}
              {%- set d = ((base - ns.avg) / base * 100) | round(0) | int if base and base > 0 else 0 -%}
              {%- if ns.best == h -%}
                {#- "now is cheapest" reads as a recommendation; when it is the only candidate left it is not one -#}
                {%- if rows | count - n + 1 > 1 -%}
                  Praegu, keskmine {{ hind }} s/kWh.
                {%- else -%}
                  Paremat ei tule, keskmine {{ hind }} s/kWh.
                {%- endif -%}
              {%- else -%}
                {{ 'Homme' if homme else 'Kell' }} {{ algus }}-{{ lopp }}, keskmine {{ hind }} s/kWh{% if d > 0 %}, {{ d }}% odavam kui praegu alustades{% endif %}.
              {%- endif -%}
            {%- else -%}
              Homseid hindu veel ei ole.
            {%- endif -%}

# One digest a day, when tomorrow's prices land (~14:00 EET). Triggered off the
# forecast sensor rather than the Nord Pool flag so the attribute is already
# rebuilt when this reads it; `from` keeps a restart from re-sending it. The tag
# makes each day's message replace the previous one instead of stacking.
automation:
  - alias: "Elekter: homsed hinnad"
    id: khe_price_tomorrow_digest
    description: "Tänase päeva järelejäänud osa ja homne: odavaimad 3 h aknad, homne keskmine tänase vastu, kalleim tund."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.elektri_hinna_prognoos
        from: "ainult täna"
        to: "täna ja homme"
    # the trigger only says tomorrow exists, not that it is a whole day; without
    # this a partial publication would push an empty message (the message body
    # guards the same way, so a manual run renders nothing rather than garbage)
    conditions:
      - condition: template
        value_template: >
          {%- set d1 = ((today_at('00:00') | as_timestamp) | int) + 86400 -%}
          {{ (state_attr('sensor.elektri_hinna_prognoos', 'prices') or [])
             | selectattr('s', 'ge', d1) | selectattr('s', 'lt', d1 + 86400) | list | count >= 20 }}
    actions:
      - action: notify.notify
        data:
          title: "Elektri hinnad"
          message: >
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set d0 = (today_at('00:00') | as_timestamp) | int -%}
            {%- set d1 = d0 + 86400 -%}
            {%- set jaanud = all | selectattr('s', 'ge', h) | selectattr('s', 'lt', d1) | list -%}
            {%- set tana = all | selectattr('s', 'ge', d0) | selectattr('s', 'lt', d1) | list -%}
            {%- set homme = all | selectattr('s', 'ge', d1) | selectattr('s', 'lt', d1 + 86400) | list -%}
            {#- 20 is the DST-tolerant floor: a normal day has 24 rows, the spring day 23 -#}
            {%- if homme | count >= 20 -%}
            {%- set ns = namespace(res=[]) -%}
            {#- one window search, run over both day parts -#}
            {%- for rows in [jaanud, homme] -%}
              {%- set w = namespace(best=none, avg=none) -%}
              {%- for i in range(rows | count - 2) -%}
                {%- set win = rows[i:i + 3] -%}
                {%- if win[-1].s - win[0].s == 2 * 3600 -%}
                  {%- set a = (win | map(attribute='t') | sum) / 3 -%}
                  {%- if w.avg is none or a < w.avg -%}{%- set w.avg = a -%}{%- set w.best = win[0].s -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns.res = ns.res + [w] -%}
            {%- endfor -%}
            {%- set ta = ns.res[0] -%}
            {%- set ho = ns.res[1] -%}
            {%- set tavg = (tana | map(attribute='t') | sum) / (tana | count) -%}
            {%- set havg = (homme | map(attribute='t') | sum) / (homme | count) -%}
            {%- set vahe = ((havg - tavg) / tavg * 100) | round(0) | int -%}
            {%- set mx = homme | max(attribute='t') -%}
            {%- macro eur(v) -%}{{ ('%.1f' | format(v * 100)).replace('.', ',') }}{%- endmacro -%}
            {%- macro kell(s) -%}{{ s | timestamp_custom('%H:%M', true) }}{%- endmacro -%}
            {% if ta.best %}Täna veel odavaim 3 h kell {{ kell(ta.best) }}-{{ kell(ta.best + 10800) }}, keskmine {{ eur(ta.avg) }} s/kWh.{% else %}Täna 3 h akent enam ei mahu.{% endif %}
            Homme keskmiselt {{ eur(havg) }} s/kWh, {{ vahe | abs }}% {{ 'kallim' if vahe > 0 else 'odavam' }} kui täna.
            {% if ho.best %}Odavaim 3 h kell {{ kell(ho.best) }}-{{ kell(ho.best + 10800) }}, keskmine {{ eur(ho.avg) }} s/kWh.{% endif %}
            Kalleim tund {{ kell(mx.s) }}, {{ eur(mx.t) }} s/kWh.
            {%- endif -%}
          data:
            tag: elektri_hind


recorder:
  exclude:
    entities:
      - sensor.elektri_hinna_prognoos
