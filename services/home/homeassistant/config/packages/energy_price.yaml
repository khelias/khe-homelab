# Real electricity price per kWh, incl. VAT, on top of the raw Nord Pool spot.
# Tariff constants come from the Alexela + Elektrilevi joint invoice for
# August 2026 (Elektrilevi package Võrk 4, 20 A). Update here when the
# invoice changes; monthly fixed fees (grid 20.64 EUR excl. VAT, supplier
# 2.02 EUR incl. VAT) are deliberately left out - they do not move with
# consumption. The Alexela contract (from 2026-08-12) adds a margin of
# 0.470 c/kWh incl. VAT on top of the 15-minute spot price; it is quoted
# incl. VAT, so it is added after the VAT multiplication.
#
# Day tariff: Mon-Fri 07:00-22:00 Estonian time, excluding public holidays.
# Night: everything else. Public holidays come from the core `workday`
# integration (binary_sensor.workday_sensor_ee, country EE, added via the UI 2026-09-12).
template:
  - binary_sensor:
      - name: "Võrgu öötariif"
        unique_id: grid_night_tariff
        icon: mdi:weather-night
        state: >
          {% set h = now().hour %}
          {{ h < 7 or h >= 22 or is_state('binary_sensor.workday_sensor_ee', 'off') }}

  - sensor:
      - name: "Elektri hind kokku"
        unique_id: electricity_price_total
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-multiple
        availability: "{{ has_value('sensor.nord_pool_ee_praegune_hind') }}"
        state: >
          {% set spot = states('sensor.nord_pool_ee_praegune_hind') | float %}
          {% set grid = 0.021 if is_state('binary_sensor.vorgu_ootariif', 'on') else 0.0369 %}
          {# renewable 0.0084 + security of supply 0.00758 + excise 0.0021 + supplier balancing 0.00373 #}
          {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
          {{ ((spot + grid + fees) * 1.24 + 0.0047) | round(5) }}
        attributes:
          spot_excl_vat: "{{ states('sensor.nord_pool_ee_praegune_hind') | float(0) }}"
          grid_tariff: "{{ 'öö' if is_state('binary_sensor.vorgu_ootariif', 'on') else 'päev' }}"

      - name: "Elektri hind kokku, järgmine"
        unique_id: electricity_price_total_next
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-clock
        availability: "{{ has_value('sensor.nord_pool_ee_jargmine_hind') }}"
        state: >
          {% set spot = states('sensor.nord_pool_ee_jargmine_hind') | float %}
          {% set t = now() + timedelta(minutes=15) %}
          {% set night = t.hour < 7 or t.hour >= 22 or is_state('binary_sensor.workday_sensor_ee', 'off') %}
          {% set grid = 0.021 if night else 0.0369 %}
          {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
          {{ ((spot + grid + fees) * 1.24 + 0.0047) | round(5) }}

  # Forecast for the chart: today's and tomorrow's prices, averaged per hour
  # (the house has an hourly meter, so the hourly mean is what gets billed),
  # with the same tariff stack applied per hour. Refreshed hourly, when tomorrow's
  # prices arrive (~14:00 EET) and at startup. Attribute keys are short and
  # the start is an epoch second, 48 points stay far under the 16 KB attribute cap;
  # the entity is excluded from the recorder below because it changes every
  # refresh and its history has no value.
  - triggers:
      - trigger: time_pattern
        minutes: "3"
      - trigger: state
        entity_id: binary_sensor.nord_pool_ee_homne_hind_on_saadaval
        to: "on"
      - trigger: homeassistant
        event: start
    actions:
      - action: nordpool.get_prices_for_date
        data:
          config_entry: 01M2AVBYMY0JB85Z9EM2D22QET
          date: "{{ now().date() }}"
          areas: [EE]
          currency: EUR
        response_variable: today
      - action: nordpool.get_prices_for_date
        continue_on_error: true
        data:
          config_entry: 01M2AVBYMY0JB85Z9EM2D22QET
          date: "{{ (now() + timedelta(days=1)).date() }}"
          areas: [EE]
          currency: EUR
        response_variable: tomorrow
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_ee
        data:
          check_date: "{{ now().date() }}"
        response_variable: wd_today
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_ee
        data:
          check_date: "{{ (now() + timedelta(days=1)).date() }}"
        response_variable: wd_tomorrow
    sensor:
      - name: "Elektri hinna prognoos"
        unique_id: electricity_price_forecast
        icon: mdi:chart-timeline-variant
        state: >
          {% set tmr = tomorrow.EE if tomorrow is defined and tomorrow.EE is defined else [] %}
          {{ 'täna ja homme' if tmr | count > 0 else 'ainult täna' }}
        attributes:
          prices: >
            {% set ns = namespace(out=[]) %}
            {% set tmr = tomorrow.EE if tomorrow is defined and tomorrow.EE is defined else [] %}
            {% set wdt = wd_today['binary_sensor.workday_sensor_ee'].workday %}
            {% set wdm = wd_tomorrow['binary_sensor.workday_sensor_ee'].workday %}
            {% set fees = 0.0084 + 0.00758 + 0.0021 + 0.00373 %}
            {# hourly meter: billing uses the plain average of the four 15-min prices, so average per hour #}
            {% for slots in (today.EE + tmr) | batch(4) %}
              {% set spot = (slots | map(attribute='price') | sum) / (slots | count) / 1000 %}
              {% set t = as_local(as_datetime(slots[0].start)) %}
              {% set wd = wdt if t.date() == now().date() else wdm %}
              {% set grid = 0.021 if (t.hour < 7 or t.hour >= 22 or not wd) else 0.0369 %}
              {% set ns.out = ns.out + [{'s': as_timestamp(slots[0].start) | int, 'p': spot | round(4), 't': ((spot + grid + fees) * 1.24 + 0.0047) | round(4)}] %}
            {% endfor %}
            {{ ns.out }}

  # Hourly view of the same stack for the dashboard row "previous / this /
  # next hour", read from the forecast attribute so all three agree with the
  # chart and with what the hourly meter is billed at.
  - sensor:
      - name: "Elektri hind, eelmine tund"
        unique_id: electricity_price_hour_prev
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-minus
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600 - 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}
      - name: "Elektri hind, see tund"
        unique_id: electricity_price_hour_now
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-multiple
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}
      - name: "Elektri hind, järgmine tund"
        unique_id: electricity_price_hour_next
        unit_of_measurement: "EUR/kWh"
        icon: mdi:cash-plus
        availability: "{{ state_attr('sensor.elektri_hinna_prognoos', 'prices') is not none }}"
        state: >
          {% set h = ((as_timestamp(now()) // 3600) * 3600 + 3600) | int %}
          {% set m = state_attr('sensor.elektri_hinna_prognoos', 'prices') | selectattr('s', 'eq', h) | list %}
          {{ m[0].t if m else none }}

recorder:
  exclude:
    entities:
      - sensor.elektri_hinna_prognoos
