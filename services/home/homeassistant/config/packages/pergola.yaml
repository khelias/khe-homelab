# The two NORDIN pergolas run on the HACS integration tuya-local, because
# Tuya's cloud declares only three of their datapoints and the roof and LED
# controls are not among them. tuya-local keeps device definitions inside its
# own folder and has no user config directory, so every update of it deletes
# the pergola definition and the entities go unavailable.
#
# The tracked copy lives in /config/tuya_local_devices. It has to be put back
# from inside the container: the HACS folder is owned by root and the deploy
# runner is not.
shell_command:
  sync_tuya_local_devices: >-
    /bin/sh -c "cp -v -f /config/tuya_local_devices/*.yaml
    /config/custom_components/tuya_local/devices/"

# met.no is a grid forecast and it missed a real shower over the house on
# 2026-09-20: partlycloudy and 0.0 mm for the next six hours while it was
# raining on the terrace. Open-Meteo's 15 minute nowcast is radar assimilated
# over Europe, so that is what the roof rule triggers on; the met.no condition
# stays as a second trigger for weather that arrives more slowly. The
# coordinates come from zone.home, so they never land in this public repo.
# Not pergola specific: move these out if anything else starts using them.
rest:
  - resource_template: >-
      https://api.open-meteo.com/v1/forecast?latitude={{ state_attr('zone.home','latitude') | round(4) }}&longitude={{ state_attr('zone.home','longitude') | round(4) }}&current=precipitation&minutely_15=precipitation&forecast_minutely_15=8&timezone=auto
    scan_interval: 300
    sensor:
      - name: "Sademed praegu"
        unique_id: open_meteo_precipitation_now
        value_template: "{{ value_json.current.precipitation }}"
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement
      - name: "Sademed kahe tunniga"
        unique_id: open_meteo_precipitation_2h
        value_template: "{{ value_json.minutely_15.precipitation | sum | round(1) }}"
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement

input_boolean:
  pergola_automaatika:
    name: "Pergola automaatika"
    icon: mdi:awning-outline

# The two units each have their own White/Warm select and they should always
# agree, so the dashboard offers one control and this mirrors it onto both.
input_select:
  pergola_valguse_toon:
    name: "Pergola valguse toon"
    icon: mdi:theme-light-dark
    options:
      - Soe
      - Valge

automation:
  # Rain closes the roof. The louvres shut watertight, so this is the only
  # weather rule that does not need the tilt angle, which these units do not
  # expose. An unknown roof state counts as not closed: closing a closed roof
  # costs nothing, leaving it open in the rain does.
  - alias: "Pergola: vihm sulgeb katuse"
    id: pergola_rain_closes_roof
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.sademed_praegu
        above: 0
        id: sademed
      - trigger: state
        entity_id: weather.forecast_kodu
        id: prognoos
        to:
          - rainy
          - pouring
          - lightning
          - lightning-rainy
          - snowy
          - snowy-rainy
          - hail
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_automaatika
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: cover.pergola_katus
            state: closed
    actions:
      - action: cover.close_cover
        target:
          entity_id: cover.pergola_katus
      - action: notify.notify
        data:
          title: "Pergola"
          message: >-
            {% if trigger.id == 'sademed' %}
              Sajab ({{ states('sensor.sademed_praegu') }} mm), katus suleti.
            {% else %}
              Ilm läks "{{ states('weather.forecast_kodu') }}", katus suleti.
            {% endif %}

  - alias: "Pergola: valgustus loojangul"
    id: pergola_lights_at_sunset
    description: >-
      Ainult siis, kui keegi on kodus. zone.home olek on kodusolijate arv.
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_automaatika
        state: "on"
      - condition: numeric_state
        entity_id: zone.home
        above: 0
    actions:
      - action: light.turn_on
        target:
          entity_id: light.pergola_valgustus
        data:
          brightness_pct: 60

  - alias: "Pergola: valguse toon mõlemale"
    id: pergola_light_tone_both
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.pergola_valguse_toon
        to:
          - Soe
          - Valge
    actions:
      - action: select.select_option
        target:
          entity_id:
            - select.pergola_parem_valguse_toon
            - select.pergola_vasak_valguse_toon
        data:
          option: "{{ 'Warm' if trigger.to_state.state == 'Soe' else 'White' }}"

  - alias: "Pergola: valgustus välja"
    id: pergola_lights_off
    description: >-
      Kell 23:00 või kohe, kui viimane inimene kodust lahkub.
    mode: single
    triggers:
      - trigger: time
        at: "23:00:00"
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_automaatika
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.pergola_valgustus

  - alias: "Pergola: taasta tuya-local seadmefail"
    id: pergola_restore_tuya_local_device_config
    description: >-
      tuya-local uuendus kustutab pergola seadmefaili ja entityd kaovad.
      Kopeeri fail igal käivitusel tagasi, et järgmine restart oleks terve.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.sync_tuya_local_devices
      # The copy lands after the config entries have already read the old
      # folder, so reload them or the repair only takes effect one restart
      # later.
      - delay: "00:00:05"
      - action: homeassistant.reload_config_entry
        target:
          entity_id:
            - cover.pergola_parem
            - cover.pergola_vasak

# The two pergolas are one roof and one run of lighting as far as the terrace
# is concerned, so the groups are what the dashboard and the automations use;
# the per-unit entities stay for the cases where only one side needs moving.
cover:
  - platform: group
    name: "Pergola katus"
    unique_id: pergola_katus
    entities:
      - cover.pergola_parem
      - cover.pergola_vasak

light:
  - platform: group
    name: "Pergola valgustus"
    unique_id: pergola_valgustus
    entities:
      - light.pergola_parem_valgustus
      - light.pergola_vasak_valgustus
