# The two NORDIN pergolas run on the HACS integration tuya-local, because
# Tuya's cloud declares only three of their datapoints and the roof and LED
# controls are not among them. tuya-local keeps device definitions inside its
# own folder and has no user config directory, so every update of it deletes
# the pergola definition and the entities go unavailable.
#
# The tracked copy lives in /config/tuya_local_devices. It has to be put back
# from inside the container: the HACS folder is owned by root and the deploy
# runner is not. Prints 1 when it had to copy anything, so the restore rule
# restarts only after a wipe and cannot loop.
shell_command:
  sync_tuya_local_devices: >-
    /bin/sh -c 'changed=0; for f in /config/tuya_local_devices/*.yaml;
    do t=/config/custom_components/tuya_local/devices/${f##*/};
    cmp -s "$f" "$t" || { cp -f "$f" "$t" && changed=1; }; done;
    echo $changed'

# met.no is a grid forecast and it missed a real shower over the house on
# 2026-09-20: partlycloudy and 0.0 mm for the next six hours while it was
# raining on the terrace. Open-Meteo's 15 minute nowcast is radar assimilated
# over Europe, so that is what the roof rule triggers on; the met.no condition
# stays as a second trigger for weather that arrives more slowly. The
# coordinates come from zone.home, so they never land in this public repo.
# Not pergola specific: move these out if anything else starts using them.
rest:
  - resource_template: >-
      https://api.open-meteo.com/v1/forecast?latitude={{ state_attr('zone.home','latitude') | round(4) }}&longitude={{ state_attr('zone.home','longitude') | round(4) }}&current=precipitation&minutely_15=precipitation&forecast_minutely_15=8&timezone=auto
    scan_interval: 300
    sensor:
      - name: "Sademed praegu"
        unique_id: open_meteo_precipitation_now
        value_template: "{{ value_json.current.precipitation }}"
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement
      - name: "Sademed kahe tunniga"
        unique_id: open_meteo_precipitation_2h
        value_template: "{{ value_json.minutely_15.precipitation | sum | round(1) }}"
        unit_of_measurement: mm
        device_class: precipitation
        state_class: measurement

# Two switches, not one: the roof rule is weather protection and the light
# rule is comfort. Turning the lights off for an evening should not also leave
# the roof open in the rain.
input_boolean:
  pergola_katuse_automaatika:
    name: "Pergola katuse automaatika"
    icon: mdi:awning-outline
  pergola_valguse_automaatika:
    name: "Pergola valguse automaatika"
    icon: mdi:lightbulb-auto
  pergola_vihma_teavitus:
    name: "Pergola vihmateavitus"
    icon: mdi:cellphone-message
  pergola_valgus_ainult_kodus:
    name: "Pergola valgus ainult kui keegi kodus"
    icon: mdi:home-account

# What the evening light rule uses. Kept as helpers rather than numbers in the
# automation so they can be changed from the dashboard without a deploy.
input_number:
  pergola_valguse_heledus:
    name: "Pergola õhtuse valguse heledus"
    icon: mdi:brightness-percent
    min: 5
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
  pergola_valgus_nihe:
    name: "Pergola valgus enne loojangut"
    icon: mdi:weather-sunset-down
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    mode: box
  pergola_teavituse_vaikus:
    name: "Pergola teavituse vaikus"
    icon: mdi:bell-sleep
    min: 1
    max: 24
    step: 1
    unit_of_measurement: h
    mode: box

# Marks when the rain rule last said anything, so it can keep quiet without
# also skipping the close command. See the rule for why the two differ.
input_datetime:
  pergola_vihmateade:
    name: "Pergola: viimane vihmateade"
    icon: mdi:message-alert
    has_date: true
    has_time: true
  pergola_valgus_kustub:
    name: "Pergola valgus kustub"
    icon: mdi:clock-outline
    has_date: false
    has_time: true

# The two units each have their own White/Warm select and they should always
# agree, so the dashboard offers one control and this mirrors it onto both.
input_select:
  pergola_ohtune_toon:
    name: "Pergola õhtune toon"
    icon: mdi:weather-night
    options:
      - Soe
      - Valge
  pergola_valguse_toon:
    name: "Pergola valguse toon"
    icon: mdi:theme-light-dark
    options:
      - Soe
      - Valge

automation:
  # Rain closes the roof. The louvres shut watertight, so this is the only
  # weather rule that does not need the tilt angle, which these units do not
  # expose. An unknown roof state counts as not closed: closing a closed roof
  # costs nothing, leaving it open in the rain does.
  - alias: "Pergola: vihm sulgeb katuse"
    id: pergola_rain_closes_roof
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.sademed_praegu
        above: 0
        id: sademed
      - trigger: state
        entity_id: weather.forecast_kodu
        id: prognoos
        to:
          - rainy
          - pouring
          - lightning
          - lightning-rainy
          - snowy
          - snowy-rainy
          - hail
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_katuse_automaatika
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: cover.pergola_katus
            state: closed
    # The roof never reports its position, so "is it already closed" cannot be
    # asked and the close command goes out on every shower. That costs nothing,
    # a closed roof simply does not move. The notification would cost attention,
    # so it waits out input_number.pergola_teavituse_vaikus.
    actions:
      - action: cover.close_cover
        target:
          entity_id: cover.pergola_katus
      - if:
          - condition: state
            entity_id: input_boolean.pergola_vihma_teavitus
            state: "on"
          - condition: template
            value_template: >-
              {{ as_timestamp(now())
                 - as_timestamp(states('input_datetime.pergola_vihmateade'), 0)
                 > (states('input_number.pergola_teavituse_vaikus') | int(6)) * 3600 }}
        then:
          - action: notify.notify
            data:
              title: "Pergola"
              message: >-
                {% if trigger.id == 'sademed' %}
                  Sajab ({{ states('sensor.sademed_praegu') }} mm), katus suleti.
                {% else %}
                  Ilm läks "{{ states('weather.forecast_kodu') }}", katus suleti.
                {% endif %}
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.pergola_vihmateade
            data:
              timestamp: "{{ as_timestamp(now()) }}"

  - alias: "Pergola: valgustus loojangul"
    id: pergola_lights_at_sunset
    description: >-
      Käivitub input_number.pergola_valgus_nihe minutit enne loojangut. Sun
      käivitaja nihet ei saa templategi anda, sellepärast on see template.
      Kohalolekut arvestatakse ainult siis, kui vastav lüliti on sees;
      zone.home olek on kodusolijate arv.
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set t = state_attr('sun.sun', 'next_setting') %}
          {% if t is none %}false
          {% else %}
            {% set s = (t | as_datetime - now()).total_seconds() %}
            {{ s >= 0 and s <= (states('input_number.pergola_valgus_nihe') | int(15)) * 60 }}
          {% endif %}
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_valguse_automaatika
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.pergola_valgus_ainult_kodus
            state: "off"
          - condition: numeric_state
            entity_id: zone.home
            above: 0
    actions:
      - action: select.select_option
        target:
          entity_id:
            - select.pergola_parem_valguse_toon
            - select.pergola_vasak_valguse_toon
        data:
          option: "{{ states('input_select.pergola_ohtune_toon') }}"
      # keep the dashboard control showing what the lights are actually doing
      - action: input_select.select_option
        target:
          entity_id: input_select.pergola_valguse_toon
        data:
          option: "{{ states('input_select.pergola_ohtune_toon') }}"
      - action: light.turn_on
        target:
          entity_id: light.pergola_valgustus
        data:
          brightness_pct: "{{ states('input_number.pergola_valguse_heledus') | int(60) }}"

  - alias: "Pergola: valguse toon mõlemale"
    id: pergola_light_tone_both
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.pergola_valguse_toon
        to:
          - Soe
          - Valge
    actions:
      - action: select.select_option
        target:
          entity_id:
            - select.pergola_parem_valguse_toon
            - select.pergola_vasak_valguse_toon
        data:
          option: "{{ trigger.to_state.state }}"

  - alias: "Pergola: valgustus välja"
    id: pergola_lights_off
    description: >-
      input_datetime.pergola_valgus_kustub ajal, või kohe kui viimane inimene
      lahkub, kui kohalolekut üldse arvestatakse.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.pergola_valgus_kustub
        id: aeg
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        id: lahkuti
    conditions:
      - condition: state
        entity_id: input_boolean.pergola_valguse_automaatika
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: aeg
          - condition: state
            entity_id: input_boolean.pergola_valgus_ainult_kodus
            state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.pergola_valgustus

  - alias: "Pergola: taasta tuya-local seadmefail"
    id: pergola_restore_tuya_local_device_config
    description: >-
      tuya-local uuendus kustutab pergola seadmefaili ja entityd kaovad.
      Kopeeri fail igal käivitusel tagasi, et järgmine restart oleks terve.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.sync_tuya_local_devices
        response_variable: sync
      # The copy lands after the config entries have already read the old
      # folder. A reload is not enough: when the update also bumps the entry
      # version, the migration fails on the missing file and leaves the
      # entries in migration_error, which only a restart clears (2026.9.2 on
      # 2026-09-25).
      - if:
          - condition: template
            value_template: "{{ sync.stdout | trim == '1' }}"
        then:
          - action: homeassistant.restart

# The two pergolas are one roof and one run of lighting as far as the terrace
# is concerned, so the groups are what the dashboard and the automations use;
# the per-unit entities stay for the cases where only one side needs moving.
cover:
  - platform: group
    name: "Pergola katus"
    unique_id: pergola_katus
    entities:
      - cover.pergola_parem
      - cover.pergola_vasak

light:
  - platform: group
    name: "Pergola valgustus"
    unique_id: pergola_valgustus
    entities:
      - light.pergola_parem_valgustus
      - light.pergola_vasak_valgustus
