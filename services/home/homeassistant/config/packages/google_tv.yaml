# Google TV Streamer helpers on top of the Android TV Remote integration.
# The integration reports the foreground app as its Android package name
# ("com.google.android.youtube.tv"), so the dashboard reads this label instead.
# The house's own apps match on a part of the package name, because their exact
# packages were not known when this was written; anything else falls back to the
# last part of the name. Add apps as they show up in the streamer's history.
template:
  # Watching means an app is in front. The home screen is not watch time: the streamer
  # was expected to report ambient mode (dreamx) when idle, but it never has, idle stays
  # on the launcher (50 min of it on 2026-09-24 with nobody watching). Search, settings
  # and the launcher are the same kind of in-between screen. The idle list is repeated
  # in the session log below.
  - binary_sensor:
      - name: "Teleri vaatamine"
        unique_id: google_tv_watching
        state: >
          {{ states('sensor.teleri_app') not in ['Avaleht', 'Ekraanisäästja', 'Otsing', 'Seaded',
             'Väljas', 'Sees', 'unknown', 'unavailable'] }}
      # Any app outside the five named ones, so "Muu" is counted like them rather than as a
      # remainder: a difference of two counters that update apart would go down and up.
      - name: "Teleri muu äpp"
        unique_id: google_tv_other_app
        state: >
          {{ is_state('binary_sensor.teleri_vaatamine', 'on') and states('sensor.teleri_app')
             not in ['YouTube', 'Elisa Elamus', 'Jupiter', 'Go3', 'Stremio'] }}
  - sensor:
      - name: "Teleri äpp"
        unique_id: google_tv_app_label
        icon: mdi:television-play
        availability: "{{ has_value('media_player.google_tv_streamer') }}"
        state: >
          {% if is_state('media_player.google_tv_streamer', 'off') %}Väljas{% else %}
          {% set exact = {
               'com.google.android.apps.tv.launcherx': 'Avaleht',
               'com.google.android.apps.tv.dreamx': 'Ekraanisäästja',
               'com.google.android.apps.mediashell': 'Cast',
               'com.google.android.katniss': 'Otsing',
               'com.android.tv.settings': 'Seaded',
               'com.google.android.youtube.tv': 'YouTube',
               'com.google.android.youtube.tvkids': 'YouTube Kids',
               'com.google.android.youtube.tvmusic': 'YouTube Music'} %}
          {% set parts = [['elisa', 'Elisa Elamus'], ['jupiter', 'Jupiter'], ['go3', 'Go3'],
                          ['stremio', 'Stremio'], ['netflix', 'Netflix']] %}
          {% set a = state_attr('media_player.google_tv_streamer', 'app_id') or '' %}
          {% set hit = parts | selectattr(0, 'in', a) | map(attribute=1) | list %}
          {{ exact[a] if a in exact else hit[0] if hit else (a.split('.') | last | capitalize) if a else 'Sees' }}{% endif %}

  # Today's sessions for the Teler tab, as {app, start, end} with epoch seconds and end
  # none while running. The raw label changes read as noise: Elisa, a 3 s voice search,
  # Elisa again. So a return to the same app within 3 minutes continues its session.
  # The state is the day the list belongs to; midnight starts a new list.
  - trigger:
      - trigger: state
        entity_id: sensor.teleri_app
        to: ~
      - trigger: time
        at: "00:00:00"
    sensor:
      - name: "Teleri seansid"
        unique_id: google_tv_sessions
        icon: mdi:format-list-bulleted
        state: "{{ now().date() | string }}"
        attributes:
          seansid: >
            {% set t = as_timestamp(now()) | int %}
            {% set app = states('sensor.teleri_app') %}
            {% set ns = namespace(s=(this.attributes.get('seansid') or []) if this.state == now().date() | string else []) %}
            {% if ns.s and ns.s[-1].end is none %}{% set ns.s = ns.s[:-1] + [dict(ns.s[-1], end=t)] %}{% endif %}
            {% if app not in ['Avaleht', 'Ekraanisäästja', 'Otsing', 'Seaded', 'Väljas', 'Sees', 'unknown', 'unavailable'] %}
              {% if ns.s and ns.s[-1].app == app and t - ns.s[-1].end < 180 %}{% set ns.s = ns.s[:-1] + [dict(ns.s[-1], end=none)] %}
              {% else %}{% set ns.s = ns.s + [{'app': app, 'start': t, 'end': none}] %}{% endif %}
            {% endif %}
            {{ ns.s }}

  # The per-app "today" counters again, as total_increasing for the week chart. A daily max
  # of the history_stats sensors is wrong: they reset only after midnight, so each day's
  # max was the previous day's total. Summed per day, a reset is a new cycle and counts 0.
  - sensor:
      - {name: "YouTube vaadatud", unique_id: google_tv_youtube_counter, state: "{{ states('sensor.youtube_tana') }}",
         availability: "{{ has_value('sensor.youtube_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}
      - {name: "Elisa Elamus vaadatud", unique_id: google_tv_elisa_counter, state: "{{ states('sensor.elisa_elamus_tana') }}",
         availability: "{{ has_value('sensor.elisa_elamus_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}
      - {name: "Jupiter vaadatud", unique_id: google_tv_jupiter_counter, state: "{{ states('sensor.jupiter_tana') }}",
         availability: "{{ has_value('sensor.jupiter_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}
      - {name: "Go3 vaadatud", unique_id: google_tv_go3_counter, state: "{{ states('sensor.go3_tana') }}",
         availability: "{{ has_value('sensor.go3_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}
      - {name: "Stremio vaadatud", unique_id: google_tv_stremio_counter, state: "{{ states('sensor.stremio_tana') }}",
         availability: "{{ has_value('sensor.stremio_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}
      - {name: "Muu vaadatud", unique_id: google_tv_other_counter, state: "{{ states('sensor.muu_tana') }}",
         availability: "{{ has_value('sensor.muu_tana') }}", unit_of_measurement: h, device_class: duration, state_class: total_increasing}

# Watch time for the Teler tab: how long the TV was watched, and per app today. Counted
# from the recorder, so it covers only what HA saw (history starts 2026-09-23,
# when the streamer was paired). Only time in an app counts, see "Teleri vaatamine".
# The per-app list is the house's five main apps, "Muu" is every other app.
sensor:
  - platform: history_stats
    name: "Teler sees täna"
    unique_id: google_tv_on_today
    entity_id: binary_sensor.teleri_vaatamine
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Teler sees eile"
    unique_id: google_tv_on_yesterday
    entity_id: binary_sensor.teleri_vaatamine
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(days=1) }}"
    end: "{{ today_at() }}"
  - platform: history_stats
    name: "Teler sees 7 päeva"
    unique_id: google_tv_on_7_days
    entity_id: binary_sensor.teleri_vaatamine
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(days=6) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "YouTube täna"
    unique_id: google_tv_youtube_today
    entity_id: sensor.teleri_app
    state: "YouTube"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Elisa Elamus täna"
    unique_id: google_tv_elisa_today
    entity_id: sensor.teleri_app
    state: "Elisa Elamus"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Jupiter täna"
    unique_id: google_tv_jupiter_today
    entity_id: sensor.teleri_app
    state: "Jupiter"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Go3 täna"
    unique_id: google_tv_go3_today
    entity_id: sensor.teleri_app
    state: "Go3"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Stremio täna"
    unique_id: google_tv_stremio_today
    entity_id: sensor.teleri_app
    state: "Stremio"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Muu täna"
    unique_id: google_tv_other_today
    entity_id: binary_sensor.teleri_muu_app
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"


# Profile buttons on the Teler tab. Google TV has no log-out and the streamer ignores
# KEYCODE_PROFILE_SWITCH, so each script walks the home screen's profile menu: Home, left
# twice to the avatar, OK opens the picker, then the keys to that profile. The sequences
# are the ones worked out at the TV; they are blind (HA sees only the launcher package,
# not the focus) and a Google TV home screen change breaks them silently. 0.25 s between
# keys is the tested gap. Scripts are numbered by picker position; the names are in the
# local house file, not here. Position 1 is the owner's profile, which asks for a PIN: its
# script stops at the PIN screen, because a key sequence would spell the PIN out.
script:
  teler_profiil_1:
    alias: "Teleri profiil 1"
    icon: mdi:account-switch
    mode: single
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.google_tv_streamer
        data:
          command: [HOME, DPAD_LEFT, DPAD_LEFT, DPAD_CENTER, DPAD_CENTER]
          delay_secs: 0.25
  teler_profiil_2:
    alias: "Teleri profiil 2"
    icon: mdi:account-switch
    mode: single
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.google_tv_streamer
        data:
          command: [HOME, DPAD_LEFT, DPAD_LEFT, DPAD_CENTER, DPAD_RIGHT, DPAD_CENTER]
          delay_secs: 0.25
  teler_profiil_3:
    alias: "Teleri profiil 3"
    icon: mdi:account-switch
    mode: single
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.google_tv_streamer
        data:
          command: [HOME, DPAD_LEFT, DPAD_LEFT, DPAD_CENTER, DPAD_RIGHT, DPAD_RIGHT, DPAD_CENTER]
          delay_secs: 0.25
