# Google TV Streamer helpers on top of the Android TV Remote integration.
# The integration reports the foreground app as its Android package name
# ("com.google.android.youtube.tv"), so the dashboard reads this label instead.
# The house's own apps match on a part of the package name, because their exact
# packages were not known when this was written; anything else falls back to the
# last part of the name. Add apps as they show up in the streamer's history.
template:
  - sensor:
      - name: "Teleri äpp"
        unique_id: google_tv_app_label
        icon: mdi:television-play
        availability: "{{ has_value('media_player.google_tv_streamer') }}"
        state: >
          {% if is_state('media_player.google_tv_streamer', 'off') %}Väljas{% else %}
          {% set exact = {
               'com.google.android.apps.tv.launcherx': 'Avaleht',
               'com.google.android.apps.mediashell': 'Cast',
               'com.google.android.youtube.tv': 'YouTube',
               'com.google.android.youtube.tvkids': 'YouTube Kids',
               'com.google.android.youtube.tvmusic': 'YouTube Music'} %}
          {% set parts = [['elisa', 'Elisa Elamus'], ['jupiter', 'Jupiter'], ['go3', 'Go3'],
                          ['stremio', 'Stremio'], ['netflix', 'Netflix']] %}
          {% set a = state_attr('media_player.google_tv_streamer', 'app_id') or '' %}
          {% set hit = parts | selectattr(0, 'in', a) | map(attribute=1) | list %}
          {{ exact[a] if a in exact else hit[0] if hit else (a.split('.') | last | capitalize) if a else 'Sees' }}{% endif %}

# Watch time for the Teler tab: how long the TV was on, and per app today. Counted
# from the recorder, so it covers only what HA saw (history starts 2026-09-23,
# when the streamer was paired). "Avaleht" counts as on; the home screen is on
# screen too. The per-app list is the house's five main apps.
sensor:
  - platform: history_stats
    name: "Teler sees täna"
    unique_id: google_tv_on_today
    entity_id: media_player.google_tv_streamer
    state: ["on", "playing", "paused", "idle"]
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Teler sees eile"
    unique_id: google_tv_on_yesterday
    entity_id: media_player.google_tv_streamer
    state: ["on", "playing", "paused", "idle"]
    type: time
    start: "{{ today_at() - timedelta(days=1) }}"
    end: "{{ today_at() }}"
  - platform: history_stats
    name: "Teler sees 7 päeva"
    unique_id: google_tv_on_7_days
    entity_id: media_player.google_tv_streamer
    state: ["on", "playing", "paused", "idle"]
    type: time
    start: "{{ today_at() - timedelta(days=6) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "YouTube täna"
    unique_id: google_tv_youtube_today
    entity_id: sensor.teleri_app
    state: "YouTube"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Elisa Elamus täna"
    unique_id: google_tv_elisa_today
    entity_id: sensor.teleri_app
    state: "Elisa Elamus"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Jupiter täna"
    unique_id: google_tv_jupiter_today
    entity_id: sensor.teleri_app
    state: "Jupiter"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Go3 täna"
    unique_id: google_tv_go3_today
    entity_id: sensor.teleri_app
    state: "Go3"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Stremio täna"
    unique_id: google_tv_stremio_today
    entity_id: sensor.teleri_app
    state: "Stremio"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
