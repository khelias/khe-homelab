# Repo-tracked YAML dashboard (lovelace mode: yaml), registered in
# configuration.yaml. UI-built dashboards land in .storage and are not tracked.
title: Ventilatsioon
views:
  - title: Komfovent
    path: komfovent
    icon: mdi:fan
    cards:
      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.komfovent_supply_temperature
            name: Sissepuhe
          - type: tile
            entity: sensor.komfovent_extract_temperature
            name: Väljatõmme
          - type: tile
            entity: sensor.komfovent_outdoor_temperature
            name: Välisõhk
      - type: history-graph
        title: Temperatuurid, 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.komfovent_supply_temperature
            name: Sissepuhe
          - entity: sensor.komfovent_extract_temperature
            name: Väljatõmme
          - entity: sensor.komfovent_outdoor_temperature
            name: Välisõhk
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.komfovent_filter_contamination
            name: Filtri saastatus
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 85
          - type: gauge
            entity: sensor.komfovent_power
            name: Võimsus
            min: 0
            max: 400
      - type: history-graph
        title: Võimsus, 7 päeva
        hours_to_show: 168
        entities:
          - entity: sensor.komfovent_power
            name: Võimsus
      - type: entities
        title: Muud näidud
        entities:
          - entity: sensor.komfovent_heat_exchanger_efficiency
            name: Soojustagastuse efektiivsus
          - entity: sensor.komfovent_total_energy
            name: Koguenergia
