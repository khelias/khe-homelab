<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seadmete ja puude paigutus</title>
<style>
:root { --bg: #060c1b; --panel: #0c1631; --edge: rgba(111, 227, 255, 0.18); --line: #6fe3ff; --ink: #e4ecff; --muted: #8a9bc2; --amber: #ffc56e; --ok: #6fe3b4; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; display: grid; grid-template-columns: 320px 1fr; }
aside { border-right: 1px solid var(--edge); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; background: var(--panel); }
header { padding: 14px 16px 10px; border-bottom: 1px solid var(--edge); }
header h1 { margin: 0 0 6px; font-size: 18px; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
#list { overflow: auto; padding: 8px; }
.group { margin: 10px 6px 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dev { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; color: var(--ink);
  border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; font: inherit; }
.dev svg { width: 18px; height: 18px; color: var(--line); }
.dev:hover { border-color: var(--edge); }
.dev.sel { background: rgba(111, 227, 255, 0.12); border-color: var(--line); }
.dev .st { font-size: 12px; color: var(--muted); }
.dev.done .st { color: var(--ok); }
footer { border-top: 1px solid var(--edge); padding: 12px 16px; display: grid; gap: 8px; }
footer .row { display: flex; gap: 8px; flex-wrap: wrap; }
button.btn { font: inherit; color: var(--bg); background: var(--line); border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; }
button.btn.ghost { color: var(--ink); background: transparent; border: 1px solid var(--edge); }
textarea { width: 100%; height: 90px; background: #040814; color: var(--muted); border: 1px solid var(--edge); border-radius: 8px; font: 11px/1.3 ui-monospace, Menlo, monospace; }
main { position: relative; min-width: 0; min-height: 0; }
#hint { position: absolute; top: 12px; left: 12px; right: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(12, 22, 49, .92); border: 1px solid var(--edge); pointer-events: none; }
#hint b { color: var(--amber); }
#coords { position: absolute; bottom: 10px; right: 12px; color: var(--muted); font: 12px ui-monospace, Menlo, monospace; pointer-events: none; }
svg#plan { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.room { fill: #0e1a3c; stroke: none; }
.room.hl { fill: #1b2f66; }
.rlabel { fill: var(--muted); font-size: .42px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: .02px; }
.wall { fill: #2b3f78; }
.glass { stroke: #5fd8ff; stroke-width: .05; }
.door { stroke: #8a9bc2; stroke-width: .03; fill: none; stroke-dasharray: .12 .08; }
.furn { fill: none; stroke: #7f9bff; stroke-width: .03; opacity: .55; }
.site { fill: rgba(71, 217, 196, .06); stroke: rgba(71, 217, 196, .5); stroke-width: .04; }
.lot { fill: none; stroke: #9aa6ff; stroke-width: .06; stroke-dasharray: .4 .3; }
.hedge { stroke: rgba(71, 217, 196, .45); stroke-width: .7; stroke-linecap: round; }
.street { fill: var(--muted); font-size: .9px; text-anchor: middle; }
.marker circle.bg { fill: #081024; stroke: var(--line); stroke-width: .05; }
.marker.done circle.bg { stroke: var(--ok); }
.marker.sel circle.bg { fill: var(--amber); stroke: var(--amber); }
.marker svg { color: var(--line); }
.marker.sel svg { color: #1c1406; }
.marker { cursor: grab; }
.fan { fill: rgba(111, 227, 255, .10); stroke: rgba(111, 227, 255, .5); stroke-width: .04; pointer-events: none; }
.fan.sel { fill: rgba(255, 197, 110, .16); stroke: var(--amber); }
.crown { fill: rgba(71, 217, 196, .07); stroke: rgba(71, 217, 196, .6); stroke-width: .05; stroke-dasharray: .3 .2; pointer-events: none; }
.crown.sel { fill: rgba(255, 197, 110, .12); stroke: var(--amber); }
#cam[hidden], #tree[hidden] { display: none; }
#cam, #tree { display: grid; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--edge); }
#cam label, #tree label { display: grid; grid-template-columns: 78px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
#cam output, #tree output { text-align: right; font: 12px ui-monospace, Menlo, monospace; color: var(--amber); }
#cam input, #tree input { width: 100%; accent-color: var(--amber); }
#cam .note { font-size: 12px; color: var(--muted); }
.mlabel { fill: var(--ink); font-size: .36px; pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: .12px; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Seadmete ja puude paigutus</h1>
    <p>Vali seade või puu nimekirjast või plaanilt, siis klõpsa plaanil õigesse kohta. Seadet või puud saab ka lohistada. Kaamerat pööra liuguriga Suund, puu suurust muuda liuguritega Kõrgus ja Võra. Tänav on üleval. Näpista või Ctrl+ratas suumib, kahe sõrmega libistus nihutab.</p>
  </header>
  <div id="list"></div>
  <footer>
    <div id="cam" hidden>
      <label>Suund <input type="range" id="dir" min="0" max="359" step="1"><output id="dirV"></output></label>
    </div>
    <div id="tree" hidden>
      <label>Kõrgus <input type="range" id="height" min="1" max="25" step="0.5"><output id="heightV"></output></label>
      <label>Võra <input type="range" id="crown" min="0.5" max="15" step="0.5"><output id="crownV"></output></label>
    </div>
    <div class="row"><button class="btn" id="copy">Kopeeri muudatused</button><button class="btn ghost" id="reset">Taasta valitu</button></div>
    <div class="row"><button class="btn ghost" id="vDev">Seadmed</button><button class="btn ghost" id="vLot">Krunt</button><button class="btn ghost" id="zIn">+</button><button class="btn ghost" id="zOut">−</button></div>
    <div id="count" class="st"></div>
    <textarea id="out" readonly placeholder="Muudatused ilmuvad siia"></textarea>
  </footer>
</aside>
<main>
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="hint"></div>
  <div id="coords"></div>
</main>
<script type="module">
// Placement page for the house 3D model's devices (private layer) and trees (geometry layer),
// served with the model by scripts/house3d-place.py; it holds no house data itself.
import { icon } from './house3d.js';
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);
const r2 = v => Math.round(v * 100) / 100;
const metres = v => `${String(v).replace('.', ',')} m`;

const res = await fetch('model.json');
if (!res.ok) {
  document.getElementById('hint').textContent = 'Mudel puudub. Käivita leht käsuga scripts/house3d-place.py serve <mudel>.';
  throw new Error(`model.json: ${res.status}`);
}
const model = await res.json();
const rooms = model.rooms;
const roomById = Object.fromEntries(rooms.map(r => [r.id, r]));
const clone = v => JSON.parse(JSON.stringify(v));
const orig = Object.fromEntries(model.devices.map(d => [d.entity, clone(d)]));
const editable = d => ({ pos: d.pos, look: d.look, room: d.room });
// trees are keyed tree:<id> in the selection and the saved edits, so they never meet an entity id
const tkey = t => `tree:${t.id}`;
const isTree = k => !!k && k.startsWith('tree:');
const origT = Object.fromEntries((model.site.trees || []).map(t => [tkey(t), clone(t)]));
const treeEditable = t => ({ pos: t.pos, height: t.height, crown: t.crown });
// unsent edits survive a reload, but only while the model still has the values they started from
let saved = {};
try { saved = JSON.parse(localStorage.getItem('house3d-place') || '{}'); } catch (e) {}
const restore = (key, item, ed) => {
  const s = saved[key];
  return s && JSON.stringify(s.base) === JSON.stringify(ed(item)) ? { ...item, ...s.now } : { ...item };
};
const devs = model.devices.map(d => restore(d.entity, d, editable));
const byId = Object.fromEntries(devs.map(d => [d.entity, d]));
const trees = (model.site.trees || []).map(t => restore(tkey(t), t, treeEditable));
const treeByKey = Object.fromEntries(trees.map(t => [tkey(t), t]));
const KINDS = { apple: 'Õunapuu', birch: 'Kask', maple: 'Vaher' };
const treeName = {};
{
  const total = {}, seen = {};
  trees.forEach(t => { total[t.kind] = (total[t.kind] || 0) + 1; });
  trees.forEach(t => {
    seen[t.kind] = (seen[t.kind] || 0) + 1;
    treeName[tkey(t)] = !KINDS[t.kind] ? t.id : total[t.kind] > 1 ? `${KINDS[t.kind]} ${seen[t.kind]}` : KINDS[t.kind];
  });
}
const nameOf = k => (isTree(k) ? treeName[k] : byId[k].name);
const planPos = k => (isTree(k) ? treeByKey[k].pos : [byId[k].pos[0], byId[k].pos[2]]);

// room of a point: the rectangle it is in, else the nearest within a wall's thickness; outdoor devices stay outdoor
function roomAt(x, z, d) {
  if (orig[d.entity].room === 'oues') return 'oues';
  let best = null, bestDist = 0.7;
  for (const r of rooms) for (const [x0, z0, x1, z1] of r.rects) {
    const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1), dist = Math.hypot(dx, dz);
    if (dist < bestDist) { bestDist = dist; best = r.id; }
  }
  return best || d.room;
}

/* ---------- plan ---------- */
const svg = document.getElementById('plan');
const lot = model.site.lot;
const xs = lot.map(p => p[0]), zs = lot.map(p => p[1]);
const LOT_VIEW = [Math.min(...xs) - 1.5, Math.min(...zs) - 3, Math.max(...xs) - Math.min(...xs) + 3, Math.max(...zs) - Math.min(...zs) + 4.5];
const dxs = model.devices.map(d => d.pos[0]), dzs = model.devices.map(d => d.pos[2]);
const DEV_VIEW = [Math.min(...dxs) - 2.5, Math.min(...dzs) - 3, Math.max(...dxs) - Math.min(...dxs) + 5, Math.max(...dzs) - Math.min(...dzs) + 5];
let vb = DEV_VIEW.slice();
const setView = v => { vb = v.slice(); svg.setAttribute('viewBox', vb.join(' ')); };
setView(DEV_VIEW);
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const rect = (r, cls, parent) => el('rect', { x: r[0], y: r[1], width: r[2] - r[0], height: r[3] - r[1], class: cls }, parent);

el('text', { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: Math.min(...zs) - 1.4, class: 'street' }).textContent = '↑ tänav';
el('polygon', { points: lot.map(p => p.join(',')).join(' '), class: 'lot' });
(model.site.hedges || []).forEach(([a, b]) => el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: 'hedge' }));
// a deck or paving item is a rect [x0, z0, x1, z1] or an outline [[x, z], ...]
[...(model.site.decks || []), ...(model.site.paving || [])].forEach(v => Array.isArray(v[0])
  ? el('polygon', { points: v.map(p => p.join(',')).join(' '), class: 'site' }) : rect(v, 'site'));
if (model.site.porch) rect(model.site.porch, 'site');
['sandpit', 'swing', 'pergola', 'garage_roof'].forEach(k => model.site[k] && rect(model.site[k].rect, 'site'));
(model.site.outdoor_units || []).forEach(u => rect(u.rect, 'furn'));
const roomEls = {};
rooms.forEach(r => { roomEls[r.id] = r.rects.map(q => rect(q, 'room')); });
(model.furniture || []).forEach(f => f.rect ? rect(f.rect, 'furn') : el('circle', { cx: f.circle[0], cy: f.circle[1], r: f.circle[2], class: 'furn' }));
model.walls.forEach(w => {
  const [ax, az] = w.a, [bx, bz] = w.b, L = Math.hypot(bx - ax, bz - az), ux = (bx - ax) / L, uz = (bz - az) / L, nx = -uz * w.t / 2, nz = ux * w.t / 2;
  const at = u => [ax + ux * u, az + uz * u];
  const seg = (u0, u1, cls = 'wall') => { const [p0x, p0z] = at(u0), [p1x, p1z] = at(u1);
    el('polygon', { points: [[p0x + nx, p0z + nz], [p1x + nx, p1z + nz], [p1x - nx, p1z - nz], [p0x - nx, p0z - nz]].map(p => p.join(',')).join(' '), class: cls }); };
  const ops = (w.openings || []).slice().sort((p, q) => p.c - q.c);
  let u = 0;
  ops.forEach(o => {
    const s = o.c - o.w / 2, e = o.c + o.w / 2;
    if (s > u) seg(u, s);
    const [p0x, p0z] = at(s), [p1x, p1z] = at(e);
    if (o.kind === 'door') el('line', { x1: p0x, y1: p0z, x2: p1x, y2: p1z, class: 'door' });
    else el('line', { x1: p0x, y1: p0z, x2: p1x, y2: p1z, class: 'glass' });
    u = e;
  });
  if (u < L) seg(u, L);
});
rooms.forEach(r => {
  const [x0, z0, x1, z1] = r.rects[0], [lx, lz] = r.label || [(x0 + x1) / 2, (z0 + z1) / 2];
  el('text', { x: lx, y: lz, class: 'rlabel' }).textContent = r.name;
});

const fanLayer = el('g', {});
const markerLayer = el('g', {});
const mEls = {};
function marker(key, type, name) {
  const g = el('g', { class: 'marker' }, markerLayer);
  el('circle', { r: 0.36, class: 'bg' }, g);
  const ic = el('svg', { x: -0.24, y: -0.24, width: 0.48, height: 0.48, viewBox: '0 0 24 24' }, g);
  ic.innerHTML = icon(type).replace(/^<svg[^>]*>|<\/svg>$/g, '');
  ic.setAttribute('fill', 'none'); ic.setAttribute('stroke', 'currentColor'); ic.setAttribute('stroke-width', '1.8');
  ic.setAttribute('stroke-linecap', 'round'); ic.setAttribute('stroke-linejoin', 'round');
  const label = el('text', { x: 0.45, y: 0.12, class: 'mlabel' }, g);
  label.textContent = name;
  label.style.display = 'none';
  g.addEventListener('pointerdown', ev => { ev.stopPropagation(); if (sel !== key) select(key); dragging = key; dragFrom = toPlan(ev); dragMoved = false; svg.setPointerCapture(ev.pointerId); });
  mEls[key] = { g, label };
}
devs.forEach(d => marker(d.entity, d.type, d.name));
trees.forEach(t => marker(tkey(t), 'tree', treeName[tkey(t)]));

/* ---------- state ---------- */
let sel = null, dragging = null, dragFrom = null, dragMoved = false;
const changed = d => JSON.stringify(editable(orig[d.entity])) !== JSON.stringify(editable(d));
const changedT = t => JSON.stringify(treeEditable(origT[tkey(t)])) !== JSON.stringify(treeEditable(t));
// the slider's degrees run clockwise from the street side, up on the plan
const lookDeg = look => Math.round((Math.atan2(look[0], -look[1]) * 180 / Math.PI + 360) % 360);
function mark(key, x, z, isChanged) {
  const m = mEls[key];
  m.g.setAttribute('transform', `translate(${x} ${z})`);
  m.g.classList.toggle('sel', key === sel);
  m.g.classList.toggle('done', isChanged);
  m.label.style.display = key === sel ? '' : 'none';
}
function draw() {
  fanLayer.innerHTML = '';
  devs.forEach(d => {
    mark(d.entity, d.pos[0], d.pos[2], changed(d));
    if (d.look) {
      const ang = Math.atan2(d.look[1], d.look[0]), half = 30 * Math.PI / 180, R = 7, pts = [[d.pos[0], d.pos[2]]];
      for (let i = 0; i <= 12; i++) { const t = ang - half + 2 * half * i / 12; pts.push([d.pos[0] + Math.cos(t) * R, d.pos[2] + Math.sin(t) * R]); }
      el('polygon', { points: pts.map(p => p.join(',')).join(' '), class: 'fan' + (d.entity === sel ? ' sel' : '') }, fanLayer);
    }
  });
  trees.forEach(t => {
    const k = tkey(t);
    mark(k, t.pos[0], t.pos[1], changedT(t));
    el('circle', { cx: t.pos[0], cy: t.pos[1], r: t.crown / 2, class: 'crown' + (k === sel ? ' sel' : '') }, fanLayer);
  });
  if (sel) markerLayer.appendChild(mEls[sel].g);
  const selRoom = sel && !isTree(sel) ? byId[sel].room : null;
  Object.entries(roomEls).forEach(([id, els]) => els.forEach(e => e.classList.toggle('hl', selRoom === id)));
  renderList();
  const ch = devs.filter(changed), chT = trees.filter(changedT);
  const out = {};
  if (ch.length) out.devices = Object.fromEntries(ch.map(d => [d.entity, editable(d)]));
  if (chT.length) out.trees = Object.fromEntries(chT.map(t => [t.id, treeEditable(t)]));
  document.getElementById('out').value = ch.length + chT.length ? JSON.stringify(out) : '';
  document.getElementById('count').textContent = `Muudetud ${ch.length + chT.length} / ${devs.length + trees.length}`;
  const keep = [...ch.map(d => [d.entity, { base: editable(orig[d.entity]), now: editable(d) }]),
    ...chT.map(t => [tkey(t), { base: treeEditable(origT[tkey(t)]), now: treeEditable(t) }])];
  try { localStorage.setItem('house3d-place', JSON.stringify(Object.fromEntries(keep))); } catch (e) {}
  const cam = document.getElementById('cam'), sd = sel && !isTree(sel) && byId[sel];
  cam.hidden = !(sd && sd.look);
  if (!cam.hidden) {
    const deg = lookDeg(sd.look);
    document.getElementById('dir').value = deg;
    document.getElementById('dirV').textContent = `${deg}°`;
  }
  const size = document.getElementById('tree'), st = isTree(sel) && treeByKey[sel];
  size.hidden = !st;
  if (st) {
    document.getElementById('height').value = st.height;
    document.getElementById('heightV').textContent = metres(st.height);
    document.getElementById('crown').value = st.crown;
    document.getElementById('crownV').textContent = metres(st.crown);
  }
  const hint = document.getElementById('hint');
  if (!sel) hint.innerHTML = 'Vali seade või puu nimekirjast või plaanilt.';
  else if (st) hint.innerHTML = `<b>${esc(nameOf(sel))}</b>: klõpsa plaanil õigesse kohta või lohista. Suurust muuda liuguritega Kõrgus ja Võra.`;
  else hint.innerHTML = `<b>${esc(nameOf(sel))}</b>: klõpsa plaanil õigesse kohta või lohista. ${sd.look ? 'Pööramiseks kasuta vasakul liugurit Suund.' : ''}`;
}
function renderList() {
  const list = document.getElementById('list');
  const row = (key, type, name, isChanged) => `<button class="dev${key === sel ? ' sel' : ''}${isChanged ? ' done' : ''}" data-e="${esc(key)}">${icon(type)}<span>${esc(name)}</span><span class="st">${isChanged ? 'muudetud' : ''}</span></button>`;
  const groups = {};
  devs.forEach(d => { (groups[d.room] = groups[d.room] || []).push(d); });
  const order = [...rooms.map(r => r.id), 'oues'].filter(id => groups[id]);
  list.innerHTML = order.map(id => `<div class="group">${esc(id === 'oues' ? 'Õues' : roomById[id].name)}</div>` +
    groups[id].map(d => row(d.entity, d.type, d.name, changed(d))).join('')).join('') +
    (trees.length ? '<div class="group">Puud</div>' + trees.map(t => row(tkey(t), 'tree', treeName[tkey(t)], changedT(t))).join('') : '');
}
function select(id) { sel = id; draw(); }

const toPlan = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; };
function inView([x, z]) {
  const b = svg.getBoundingClientRect(), [x0, z0] = toPlan({ clientX: b.left, clientY: b.top }), [x1, z1] = toPlan({ clientX: b.right, clientY: b.bottom });
  return x >= x0 && x <= x1 && z >= z0 && z <= z1;
}
document.getElementById('list').addEventListener('click', ev => {
  const b = ev.target.closest('[data-e]');
  if (!b) return;
  select(b.dataset.e);
  if (!inView(planPos(sel))) setView(LOT_VIEW);
});
function place(key, x, z) {
  if (isTree(key)) { treeByKey[key].pos = [r2(x), r2(z)]; return; }
  const d = byId[key];
  d.pos = [r2(x), d.pos[1], r2(z)];
  d.room = roomAt(x, z, d);
}
svg.addEventListener('pointermove', ev => {
  const [x, z] = toPlan(ev);
  document.getElementById('coords').textContent = `x ${x.toFixed(2)}  z ${z.toFixed(2)}`;
  // a press on a marker only selects it until the pointer has really moved
  if (dragging && !dragMoved && Math.hypot(x - dragFrom[0], z - dragFrom[1]) > 0.15) dragMoved = true;
  if (dragging && dragMoved) { place(dragging, x, z); draw(); }
});
svg.addEventListener('pointerup', ev => {
  if (dragging) { dragging = null; return; }
  if (!sel) return;
  const [x, z] = toPlan(ev);
  place(sel, x, z);
  draw();
});
document.getElementById('reset').addEventListener('click', () => {
  if (!sel) return;
  if (isTree(sel)) {
    const o = origT[sel], t = treeByKey[sel];
    t.pos = o.pos.slice(); t.height = o.height; t.crown = o.crown;
  } else {
    const o = orig[sel], d = byId[sel];
    d.pos = o.pos.slice(); d.room = o.room; if (o.look) d.look = o.look.slice();
  }
  draw();
});
document.getElementById('dir').addEventListener('input', ev => {
  if (!sel || isTree(sel)) return;
  const a = Number(ev.target.value) * Math.PI / 180;
  byId[sel].look = [r2(Math.sin(a)), r2(-Math.cos(a))];
  draw();
});
['height', 'crown'].forEach(k => document.getElementById(k).addEventListener('input', ev => {
  if (!isTree(sel)) return;
  treeByKey[sel][k] = Number(ev.target.value);
  draw();
}));
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('out');
  if (!t.value) return;
  try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
  draw();
  document.getElementById('count').textContent += ' · kopeeritud';
});
function zoomAt(f, cx, cz) { setView([cx - (cx - vb[0]) * f, cz - (cz - vb[1]) * f, vb[2] * f, vb[3] * f]); }
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (ev.ctrlKey) { const [x, z] = toPlan(ev); zoomAt(Math.exp(ev.deltaY * 0.01), x, z); return; }
  const k = vb[2] / svg.clientWidth;
  setView([vb[0] + ev.deltaX * k, vb[1] + ev.deltaY * k, vb[2], vb[3]]);
}, { passive: false });
document.getElementById('vDev').addEventListener('click', () => setView(DEV_VIEW));
document.getElementById('vLot').addEventListener('click', () => setView(LOT_VIEW));
document.getElementById('zIn').addEventListener('click', () => zoomAt(0.75, vb[0] + vb[2] / 2, vb[1] + vb[3] / 2));
document.getElementById('zOut').addEventListener('click', () => zoomAt(1 / 0.75, vb[0] + vb[2] / 2, vb[1] + vb[3] / 2));
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') select(null); });
draw();
</script>
</body>
</html>
