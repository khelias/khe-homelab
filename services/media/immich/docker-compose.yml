services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - ./immich.config.json:/immich.config.json:ro
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - DB_HOSTNAME=immich-postgres
      - REDIS_HOSTNAME=immich-valkey
      - IMMICH_CONFIG_FILE=/immich.config.json
    ports:
      - "2283:2283"
    depends_on:
      immich-valkey:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    networks:
      - proxy
      - immich-internal
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          # ffmpeg transcode runs IN this container (v3 merged the job workers
          # into immich-server), not in immich-machine-learning. 2G caused a
          # cgroup OOM on 2026-08-03: ffmpeg 617M anon-rss + node 610M hit the
          # ceiling, kernel killed both, container restarted, in-flight uploads
          # got 502 from NPM.
          memory: 6G
          cpus: '2.00'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
    container_name: immich-machine-learning
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - immich_ml_cache:/cache
    networks:
      - immich-internal
    deploy:
      resources:
        limits:
          # nllb-clip-base-siglip peaks at ~4.7G RSS (Immich's own benchmark
          # table), so the old 4G ceiling would OOM the model load. Only the
          # multilingual CLIP models need this much; the English-only
          # ViT-B-* family fits in 3G.
          memory: 6G
          cpus: '4'
    healthcheck:
      # OpenVINO image ships without curl; use python3 (already present for the service).
      # Gunicorn binds [::]:3003 — localhost covers both stacks. Explicit urlopen
      # timeout prevents urllib from hanging longer than Docker's outer timeout.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/ping', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s  # ML model loading takes time on first start

  immich-valkey:
    image: docker.io/valkey/valkey:9-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
    container_name: immich-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - immich-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  immich-postgres:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_DB=${DB_DATABASE_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immich_pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE_NAME:-immich} -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - immich-internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.00'

volumes:
  immich_pgdata:
  immich_ml_cache:

networks:
  proxy:
    external: true
  immich-internal:
    driver: bridge
