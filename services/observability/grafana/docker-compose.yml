services:
  # Grafana: UI for Loki + Alertmanager. LAN-only on host port 3030; it sits
  # on `proxy`, but no NPM proxy host exists for it. Add CF Access OTP before
  # ever exposing it externally.
  # Loki datasource is auto-provisioned from config/provisioning/.
  grafana:
    image: grafana/grafana:13.2.3@sha256:d84563330dc9d2fd2bc096d0fb96021b5319c75bf6ed555566709998e823dec4
    container_name: grafana
    restart: unless-stopped
    ports:
      # The only ingress: LAN/Tailscale on 3030, since homepage holds 3000.
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=
      - TZ=Europe/Tallinn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/provisioning:/etc/grafana/provisioning:ro
    networks:
      - proxy
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

volumes:
  grafana_data:

networks:
  proxy:
    external: true
  observability:
    external: true
