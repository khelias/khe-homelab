services:
  # Private editor: paste/create an HTML file from any device, save it. dufs
  # runs without --auth, so CF Access is the only auth layer and the
  # container sits on draft-tunnel, a network shared only with
  # cloudflare-tunnel: nothing on proxy can reach it. Runs as UID 1000 and
  # only sees /data (the published tree).
  draft:
    image: sigoden/dufs:v0.47.0@sha256:e5152c04e41d5a9d785546278b632bf035c8a08c52d7e8d35f4b59681f5ff35a
    container_name: draft
    restart: unless-stopped
    user: "1000:1000"
    # --allow-delete is needed for PUT over an existing file, not only for
    # deleting pages.
    command: ["/data", "--bind", "0.0.0.0", "--port", "8080", "--allow-upload", "--allow-delete", "--allow-search"]
    environment:
      - TZ=Europe/Tallinn
    volumes:
      - /srv/data/pages/app:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - draft-tunnel
    # No container-internal healthcheck: sigoden/dufs is FROM scratch (no
    # shell, no wget/curl), and adding a thin Dockerfile layer just for a
    # probe breaks the "pinned upstream image" convention. Uptime Kuma cannot
    # reach draft-tunnel by design, so liveness comes from restart:
    # unless-stopped. See docs/operational-notes.md > Pages.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Public reader: serves what `draft` writes, read-only. No Access.
  pages:
    image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: pages
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/pages/app:/usr/share/nginx/html:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  proxy:
    external: true
  draft-tunnel:
    external: true
