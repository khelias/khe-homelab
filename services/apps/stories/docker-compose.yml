# Unejänku's family build at stories.khe.ee, behind Cloudflare Access
# (estate ADR-031). khe-bunny-tales' deploy fills /srv/data/stories/app; the
# audio store is filled from the laptop. Both must exist before this starts,
# or Docker creates them root-owned.
services:
  stories:
    image: nginx:1.31-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: stories
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.conf:/etc/nginx/stories-headers.conf:ro
      - /srv/data/stories/app:/usr/share/nginx/html:ro
      - /srv/data/stories/audio:/srv/audio:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  proxy:
    external: true
