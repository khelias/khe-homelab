# The client's address for the request service's limits: cloudflared and NPM
# sit on the proxy network and each appends an address to X-Forwarded-For, and
# the rightmost one outside the proxy network is taken. Through Cloudflare it is
# the visitor's own. NPM appends its $remote_addr, which a LAN client can set
# with X-Real-IP (NPM trusts private ranges), so the service also limits
# pairing in all, not only per address. Nothing here
# pins the proxy network's subnet: if it is ever recreated, `docker network
# inspect proxy` must still show this one, or this line follows it.
set_real_ip_from 172.18.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=stories_api:10m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # stories-api is recreated on every deploy; a variable upstream is resolved
    # per request through Docker's DNS instead of once at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stories_api http://stories-api:3000;

    # The tunnel reaches this server over plain HTTP.
    absolute_redirect off;

    # The page, the worker, the manifest and the catalog: asked again on every
    # visit, so a deploy shows at once.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/stories-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # nginx's mime.types has no webmanifest entry, and a server-level types
    # block would replace the whole map.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/stories-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite-hashed names never change under their name. A miss is a 404, not
    # the page: a stale chunk must fail rather than load HTML as a script.
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/stories-headers.conf;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # The audio store by sha256, Range answered by nginx. A miss is nginx's
    # 404 (alias without try_files, which mishandles alias paths).
    location ^~ /audio/ {
        alias /srv/audio/;
        include /etc/nginx/stories-headers.conf;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # The children's story requests (khe-stories docs/decisions/002). A
    # recorded idea is at most 2 MB, sent as base64 in JSON.
    location ^~ /api/ {
        limit_req zone=stories_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 3m;
        proxy_pass $stories_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 90s;
        include /etc/nginx/stories-headers.conf;
    }

    # Answered only by the service worker; without one it is a 404, not the page.
    location ^~ /saved/ { return 404; }

    # Cloudflare's own paths never reach the app's fallback.
    location ^~ /cdn-cgi/ { return 404; }
}
