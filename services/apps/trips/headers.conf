# trips.khe.ee's security headers: no framing, geolocation for the page itself.
# No script or connect limits, since nothing checks what the atlas loads.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
