server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The page: asked again on every visit, so a deploy shows at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # A miss is a 404, never the page: HTML here would leave an old worker
    # running with no way to replace it (estate ADR-041). private, because
    # Cloudflare turns a plain no-cache on a .js file into its four-hour
    # browser cache.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "private, no-cache" always;
    }

    # nginx's mime.types has no webmanifest entry, and a server-level types
    # block would replace the whole map.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # The bundle holds the private atlas, so no shared cache may keep it. A
    # miss is a 404: a stale chunk must fail rather than load HTML as a script.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # Cloudflare's own paths never reach the app's fallback.
    location ^~ /cdn-cgi/ { return 404; }

    location ~* \.(css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
