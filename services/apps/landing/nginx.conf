# A week for a share or demo asset that exists; a miss (mid-deploy, or a
# withdrawn slug) stays uncached in the browser and at the edge.
map $status $share_asset_cache {
    ~^(200|206|304)$ "private, max-age=604800, immutable";
    default          "private, no-cache";
}

# A year for a story's audio, which is named by its sha256; a miss (a
# withdrawn story) stays uncached.
map $status $stories_audio_cache {
    ~^(200|206|304)$ "private, max-age=31536000, immutable";
    default          "private, no-cache";
}

# khe.ee's pages are one static page per language, Estonian at the path and
# English under /en/ (estate ADR-048). A ?lang that differs from the page's
# language answers 301 with the other page, the query kept, so a crawler that
# runs no script lands on it and the page's own redirect agrees. $lang_arg is
# the first lowercase lang argument, as the page's script and the edge fallback
# read it: $arg_lang ignores case, and ?LANG=en&lang=et would loop.
map $args $lang_arg {
    default "";
    "~(?:^|&)lang=(?<value>[^&]*)" $value;
}

map "$uri:$lang_arg" $lang_page {
    default "";
    "/:en" /en/;
    "/architecture/:en" /en/architecture/;
    "/architecture/decisions/:en" /en/architecture/decisions/;
    "/agents/:en" /en/agents/;
    "/privacy:en" /en/privacy/;
    "/privacy/:en" /en/privacy/;
    "/en/:et" /;
    "/en/architecture/:et" /architecture/;
    "/en/architecture/decisions/:et" /architecture/decisions/;
    "/en/agents/:et" /agents/;
    "/en/privacy:et" /privacy/;
    "/en/privacy/:et" /privacy/;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The tunnel reaches this server over plain HTTP, so an absolute redirect
    # (such as /privacy -> /privacy/) would point visitors at http://.
    absolute_redirect off;

    # No includeSubDomains: HSTS on the apex must not pin LAN-only names.
    # Each location with its own add_header drops these, so they are repeated
    # there. /r/ keeps its own set: the share sites load map tiles and fonts
    # from other origins.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    if ($lang_page) { return 301 $lang_page$is_args$args; }

    # khe-sites' 404.html, with the status kept, for any address that has no page.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    # The uptime probe's path. The edge fallback (estate ADR-016) passes it
    # through, so with the homelab down it fails instead of the copy answering.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Retired 2026-10: the Lab Atlas became the architecture page. The query
    # string rides along, so ?lang=et survives the redirect.
    location = /lab { return 301 /architecture/$is_args$args; }
    location ^~ /lab/ { return 301 /architecture/$is_args$args; }

    # Moved 2026-10: the Home Assistant demo lives at /ha/. The rest of the
    # path and the query string ride along, so an old deep link still lands.
    # rewrite, not return with a capture: rewrite escapes the decoded path
    # again before it goes into Location.
    location = /house3d { return 301 /ha/$is_args$args; }
    location ^~ /house3d/ { rewrite ^/house3d/(.*)$ /ha/$1 permanent; }

    # khe-trips share sites. An unknown or withdrawn slug is a bare 404.
    location = /r { return 404; }
    location = /r/ { return 404; }

    # ^~ so the asset regex below does not take /r/ files. `private` keeps
    # Cloudflare from caching them, so an un-shared trip also leaves the edge.
    location ^~ /r/ {
        root /srv/share;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location ~ ^/r/[a-z0-9]+/assets/ {
            try_files $uri =404;
            add_header Cache-Control $share_asset_cache always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # The public khe-trips demo (estate ADR-013), a single-page app under
    # /trips/: a trip URL falls back to its index.html. Headers as on /r/
    # plus HSTS, since a public link may be the first page a visitor opens:
    # private, never indexed, and only frame-ancestors in the CSP, since the
    # map loads tiles and fonts from other origins.
    location = /trips { return 301 /trips/$is_args$args; }

    location ^~ /trips/ {
        root /srv/demo;
        try_files $uri $uri/ /trips/index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # A missing asset is a 404, not the page: a stale chunk name must fail
        # loudly rather than load HTML as a script.
        location ^~ /trips/assets/ {
            try_files $uri =404;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control $share_asset_cache always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # Unejänku's public build (estate ADR-031), from khe-bunny-tales' deploy:
    # it shadows any stories/ left in the sites root. The app routes by hash,
    # so a miss is a 404, not a page. The khe headers plus media-src for the
    # audio, and no-cache so a deploy shows at once.
    location = /stories { return 301 /stories/$is_args$args; }

    # nginx's mime.types has no webmanifest entry, and a server-level types
    # block would replace the whole map.
    location = /stories/manifest.webmanifest {
        root /srv/demo;
        types { }
        default_type application/manifest+json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        add_header Cache-Control "private, no-cache" always;
    }

    location ^~ /stories/ {
        root /srv/demo;
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        add_header Cache-Control "private, no-cache" always;

        location ^~ /stories/assets/ {
            try_files $uri =404;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
            add_header Cache-Control $share_asset_cache always;
        }

        # Range is answered by nginx.
        location ^~ /stories/audio/ {
            try_files $uri =404;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
            add_header Cache-Control $stories_audio_cache always;
        }
    }

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
    }
}
