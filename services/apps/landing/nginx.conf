# A week for a share asset that exists; a miss (mid-deploy, or a withdrawn
# slug) stays uncached in the browser and at the edge.
map $status $share_asset_cache {
    ~^(200|206|304)$ "private, max-age=604800, immutable";
    default          "private, no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The tunnel reaches this server over plain HTTP, so an absolute redirect
    # (such as /privacy -> /privacy/) would point visitors at http://.
    absolute_redirect off;

    # No includeSubDomains: HSTS on the apex must not pin LAN-only names.
    # Each location with its own add_header drops these, so they are repeated
    # there. /r/ keeps its own set: the share sites load map tiles and fonts
    # from other origins.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Retired 2026-10. Without these the landing fallback above would answer
    # an old /reports/ link with 200 and the home page.
    location = /reports { return 404; }
    location ^~ /reports/ { return 404; }

    # khe-trips share sites. A miss is a 404, not the landing fallback: an
    # unknown or withdrawn slug must not look like a live link.
    location = /r { return 404; }
    location = /r/ { return 404; }

    # ^~ so the asset regex below does not take /r/ files. `private` keeps
    # Cloudflare from caching them, so an un-shared trip also leaves the edge.
    location ^~ /r/ {
        root /srv/share;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location ~ ^/r/[a-z0-9]+/assets/ {
            try_files $uri =404;
            add_header Cache-Control $share_asset_cache always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
    }
}
