# A week for a share or demo asset that exists; a miss (mid-deploy, or a
# withdrawn slug) stays uncached in the browser and at the edge.
map $status $share_asset_cache {
    ~^(200|206|304)$ "private, max-age=604800, immutable";
    default          "private, no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The tunnel reaches this server over plain HTTP, so an absolute redirect
    # (such as /privacy -> /privacy/) would point visitors at http://.
    absolute_redirect off;

    # No includeSubDomains: HSTS on the apex must not pin LAN-only names.
    # Each location with its own add_header drops these, so they are repeated
    # there. /r/ keeps its own set: the share sites load map tiles and fonts
    # from other origins.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The uptime probe's path. The edge fallback (estate ADR-016) passes it
    # through, so with the homelab down it fails instead of the copy answering.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Retired 2026-10. Without these the landing fallback above would answer
    # an old /reports/ link with 200 and the home page.
    location = /reports { return 404; }
    location ^~ /reports/ { return 404; }

    # Retired 2026-10: the Lab Atlas became the architecture page. The query
    # string rides along, so ?lang=et survives the redirect.
    location = /lab { return 301 /architecture/$is_args$args; }
    location ^~ /lab/ { return 301 /architecture/$is_args$args; }

    # Moved 2026-10: the Home Assistant demo lives at /ha/. The rest of the
    # path and the query string ride along, so an old deep link still lands.
    # rewrite, not return with a capture: rewrite escapes the decoded path
    # again before it goes into Location.
    location = /house3d { return 301 /ha/$is_args$args; }
    location ^~ /house3d/ { rewrite ^/house3d/(.*)$ /ha/$1 permanent; }

    # One directory per ADR. An unknown id is a 404, not the landing
    # fallback, and the bare directory (no index) goes to the register
    # instead of answering 403.
    location = /architecture/decisions/ { return 301 /architecture/#decisions; }
    location ^~ /architecture/decisions/ {
        try_files $uri $uri/ =404;
    }

    # khe-trips share sites. A miss is a 404, not the landing fallback: an
    # unknown or withdrawn slug must not look like a live link.
    location = /r { return 404; }
    location = /r/ { return 404; }

    # ^~ so the asset regex below does not take /r/ files. `private` keeps
    # Cloudflare from caching them, so an un-shared trip also leaves the edge.
    location ^~ /r/ {
        root /srv/share;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location ~ ^/r/[a-z0-9]+/assets/ {
            try_files $uri =404;
            add_header Cache-Control $share_asset_cache always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # The public khe-trips demo (estate ADR-013), a single-page app under
    # /trips/: a trip URL falls back to its index.html. Headers as on /r/
    # plus HSTS, since a public link may be the first page a visitor opens:
    # private, never indexed, and only frame-ancestors in the CSP, since the
    # map loads tiles and fonts from other origins.
    location = /trips { return 301 /trips/$is_args$args; }

    location ^~ /trips/ {
        root /srv/demo;
        try_files $uri $uri/ /trips/index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # A missing asset is a 404, not the page: a stale chunk name must fail
        # loudly rather than load HTML as a script.
        location ^~ /trips/assets/ {
            try_files $uri =404;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control $share_asset_cache always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
    }
}
