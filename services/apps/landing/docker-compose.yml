services:
  landing:
    image: nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/sites/khe:/usr/share/nginx/html:ro
      - /srv/data/trips/share:/srv/share/r:ro
      # Created and filled by the khe-trips deploy; it must exist before this
      # container starts, or Docker creates it root-owned.
      - /srv/data/trips/demo:/srv/demo/trips:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  proxy:
    external: true
