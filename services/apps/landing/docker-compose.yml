services:
  landing:
    image: nginx:1.31-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/sites/khe:/usr/share/nginx/html:ro
      - /srv/data/trips/share:/srv/share/r:ro
      # Created and filled by the khe-trips deploy; it must exist before this
      # container starts, or Docker creates it root-owned.
      - /srv/data/trips/demo:/srv/demo/trips:ro
      # Filled by the khe-bunny-tales deploy (estate ADR-031); the same rule.
      - /srv/data/stories/public:/srv/demo/stories:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  proxy:
    external: true
