services:
  games:
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    container_name: games
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/games/launcher:/usr/share/nginx/html:ro
      - /srv/data/games/study:/srv/data/games/study:ro
    networks:
      - proxy
      - games-internal
    depends_on:
      - adventure-web
      - adventure-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  # khe-ai-adventure publishes both images from one commit (estate
  # ADR-008). Keep the two pins on the same commit; adventure's CI moves
  # them together in one pin PR.
  adventure-web:
    image: ghcr.io/khelias/khe-ai-adventure-web:main@sha256:d9be5f266c1ecb7fae49d9d4957573456514f59c5908ac3437797333b00e3f6b
    container_name: adventure-web
    restart: unless-stopped
    environment:
      - API_SECRET=${API_SECRET:-}
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  adventure-proxy:
    image: ghcr.io/khelias/khe-ai-adventure-proxy:main@sha256:8d32a3cebcf8140e864cb579e9788cdd50c42b7361f90beae4c4de5b02f90f32
    container_name: adventure-proxy
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_SECRET=${API_SECRET:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - CLAUDE_MODEL=claude-sonnet-4-6
      - DEFAULT_PROVIDER=gemini
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'

networks:
  proxy:
    external: true
  games-internal:
    driver: bridge
