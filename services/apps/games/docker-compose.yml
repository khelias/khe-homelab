services:
  games:
    image: nginx:1.31-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: games
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/games/launcher:/usr/share/nginx/html:ro
      - /srv/data/games/study:/srv/data/games/study:ro
    networks:
      - proxy
      - games-internal
    depends_on:
      - adventure-web
      - adventure-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  # khe-ai-adventure publishes both images from one commit (estate
  # ADR-008). Keep the two pins on the same commit; adventure's CI moves
  # them together in one pin PR.
  adventure-web:
    image: ghcr.io/khelias/khe-ai-adventure-web:main@sha256:6be4fdd94bad553b80c47912abbd9f55e9ce9076c7defbf21e9d97f3415f6760
    container_name: adventure-web
    restart: unless-stopped
    environment:
      - API_SECRET=${API_SECRET:-}
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  adventure-proxy:
    image: ghcr.io/khelias/khe-ai-adventure-proxy:main@sha256:03e42032cd16e7daa14af059ec26c5448f8b53df6e20490db6c9d78fa34b6ba1
    container_name: adventure-proxy
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_SECRET=${API_SECRET:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - CLAUDE_MODEL=claude-sonnet-4-6
      - DEFAULT_PROVIDER=gemini
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'

networks:
  proxy:
    external: true
  games-internal:
    driver: bridge
