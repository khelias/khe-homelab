services:
  games:
    image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: games
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/games/launcher:/usr/share/nginx/html:ro
      - /srv/data/games/study:/srv/data/games/study:ro
    networks:
      - proxy
      - games-internal
    depends_on:
      - adventure-web
      - adventure-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  # khe-ai-adventure publishes both images from one commit (estate
  # ADR-008). Keep the two pins on the same commit; adventure's CI moves
  # them together in one pin PR.
  adventure-web:
    image: ghcr.io/khelias/khe-ai-adventure-web:main@sha256:def52f74512467326b0f0abb10a0f4389bfe18756fd07c1cc92f6a1de3f9d357
    container_name: adventure-web
    restart: unless-stopped
    environment:
      - API_SECRET=${API_SECRET:-}
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  adventure-proxy:
    image: ghcr.io/khelias/khe-ai-adventure-proxy:main@sha256:85269a2024b5901db4bb330b7dbaddc6554fdba17c2b7b6c94b5f975b15275df
    container_name: adventure-proxy
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_SECRET=${API_SECRET:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - CLAUDE_MODEL=claude-sonnet-4-6
      - DEFAULT_PROVIDER=gemini
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'

networks:
  proxy:
    external: true
  games-internal:
    driver: bridge
