services:
  games:
    image: nginx:1.31-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    container_name: games
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/data/games/launcher:/usr/share/nginx/html:ro
      - /srv/data/games/study:/srv/data/games/study:ro
    networks:
      - proxy
      - games-internal
    depends_on:
      - adventure-web
      - adventure-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  # khe-ai-adventure publishes both images from one commit (estate
  # ADR-008). Keep the two pins on the same commit; adventure's CI moves
  # them together in one pin PR.
  adventure-web:
    image: ghcr.io/khelias/khe-ai-adventure-web:main@sha256:aa27e3e2178cf278178054e7c880c4dc06e27fedf3011165f4c28f0203d3f795
    container_name: adventure-web
    restart: unless-stopped
    environment:
      - API_SECRET=${API_SECRET:-}
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  adventure-proxy:
    image: ghcr.io/khelias/khe-ai-adventure-proxy:main@sha256:5f120525854805687cc142d6448517f474113ef0d2b30b02c25e99cc9e0c9722
    container_name: adventure-proxy
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_SECRET=${API_SECRET:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - CLAUDE_MODEL=claude-sonnet-4-6
      - DEFAULT_PROVIDER=gemini
      - TZ=Europe/Tallinn
    networks:
      - games-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'

networks:
  proxy:
    external: true
  games-internal:
    driver: bridge
