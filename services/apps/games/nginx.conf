# Use CF-Connecting-IP (real visitor IP through the CF tunnel) as rate-limit key.
# Fall back to $remote_addr for requests that arrive without the header (LAN, dev).
# Without this map, $binary_remote_addr sees only cloudflared's socket IP, so every
# request through the tunnel would share one counter — useless for per-visitor limiting.
map $http_cf_connecting_ip $adventure_limit_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $adventure_limit_key zone=adventure_api:10m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Both adventure containers are recreated on every deploy. Variable
    # upstreams make nginx resolve them per request through Docker's DNS
    # instead of once at startup, which would leave it on a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $adventure_web http://adventure-web:8080;
    set $adventure_proxy http://adventure-proxy:3000;

    # The tunnel reaches this server over plain HTTP, so an absolute redirect
    # (such as /adventure -> /adventure/) would point visitors at http://.
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    # Launcher at root
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Study game at /study/ — React Router SPA
    location /study/ {
        root /srv/data/games;
        try_files $uri $uri/ /study/index.html =404;
    }

    # Long-term cache for hashed Vite assets under /study/
    location /study/assets/ {
        root /srv/data/games;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
    }

    # Adventure game: the adventure-web container serves the SPA and sets its
    # own caching. No add_header here, so the server-level security headers
    # above are inherited.
    location /adventure/ {
        proxy_pass $adventure_web;
        proxy_set_header Host $host;
    }

    # Gemini proxy — reverse proxy to adventure-proxy container
    # Strips /adventure/api/ prefix; POST /adventure/api/gemini → POST /gemini upstream
    location /adventure/api/ {
        # Rate limit to protect the Gemini API quota (30 req/min/IP, burst 10)
        limit_req zone=adventure_api burst=10 nodelay;

        # A variable proxy_pass passes the URI unchanged, so the prefix is
        # stripped here instead.
        rewrite ^/adventure/api/(.*)$ /$1 break;
        proxy_pass $adventure_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM responses can take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Don't let browsers or CDNs cache AI responses
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
    }
}
