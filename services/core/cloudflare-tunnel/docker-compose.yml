services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflare-tunnel
    restart: unless-stopped
    # --metrics binds the diagnostics server the healthcheck below queries. Bound
    # to loopback, not 0.0.0.0: the check runs inside this container's netns, so
    # nothing on the proxy network needs to reach it.
    command: tunnel --metrics 127.0.0.1:20241 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TZ=Europe/Tallinn
    healthcheck:
      # `cloudflared version` only proved the binary could execute. It stayed green
      # through a full outage on 2026-08-22, when every hostname served CF error
      # 1033 because the tunnel was not registered with the edge: no crash, so
      # `restart: unless-stopped` saw nothing, and never unhealthy, so autoheal saw
      # nothing either. `tunnel ready` queries /ready, which reflects real edge
      # registration. The image is distroless, so this must use the cloudflared
      # binary itself; there is no shell, curl or wget to probe with.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Connecting to the edge takes longer than starting the process.
      start_period: 30s
    networks:
      - proxy
      - draft-tunnel
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

networks:
  proxy:
    external: true
  # The draft.khe.ee editor runs without an app login, so only the tunnel may
  # reach it.
  # Owned here because this stack deploys before apps/pages.
  draft-tunnel:
    name: draft-tunnel
    driver: bridge
    internal: true
