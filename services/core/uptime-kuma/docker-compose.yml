services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TZ=Europe/Tallinn
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - proxy
      - observability
    healthcheck:
      test: ["CMD", "node", "/app/extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

volumes:
  uptime_kuma_data:

networks:
  proxy:
    external: true
  observability:
    external: true
