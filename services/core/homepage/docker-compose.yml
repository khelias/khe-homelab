services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv:/srv:ro
    environment:
      # homepage:3000 is the Uptime Kuma monitor's URL; any other Host gets a 400.
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_DOMAIN},homepage:3000
      - TZ=Europe/Tallinn
      # AdGuard Home
      - HOMEPAGE_VAR_ADGUARD_USERNAME=${ADGUARD_USERNAME}
      - HOMEPAGE_VAR_ADGUARD_PASSWORD=${ADGUARD_PASSWORD}
      # Immich
      - HOMEPAGE_VAR_IMMICH_API_KEY=${IMMICH_API_KEY}
      # Proxmox
      - HOMEPAGE_VAR_PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

networks:
  proxy:
    external: true
