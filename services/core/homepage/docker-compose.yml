services:
  # Docker socket proxy: read-only container access for Homepage's status and
  # stats tiles. Homepage is internet-facing (dash.khe.ee), so it does not get
  # the socket itself.
  homepage-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: homepage-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1  # GET /containers (list, inspect, stats)
      POST: 0        # No writes
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      TASKS: 0
      CONFIGS: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
      LOG_LEVEL: warning
    networks:
      - homepage-socket
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    environment:
      # homepage:3000 is the Uptime Kuma monitor's URL; any other Host gets a 400.
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_DOMAIN},homepage:3000
      - TZ=Europe/Tallinn
      # AdGuard Home
      - HOMEPAGE_VAR_ADGUARD_USERNAME=${ADGUARD_USERNAME}
      - HOMEPAGE_VAR_ADGUARD_PASSWORD=${ADGUARD_PASSWORD}
      # Immich
      - HOMEPAGE_VAR_IMMICH_API_KEY=${IMMICH_API_KEY}
      # Proxmox
      - HOMEPAGE_VAR_PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
    depends_on:
      homepage-socket-proxy:
        condition: service_healthy
    networks:
      - proxy
      - homepage-socket
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

networks:
  proxy:
    external: true
  homepage-socket:
    driver: bridge
    internal: true  # Only homepage <-> socket proxy
