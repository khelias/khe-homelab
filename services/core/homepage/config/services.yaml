- Igapäev:
    - Immich:
        icon: immich
        href: https://photos.khe.ee
        description: Fotod ja videod
        server: my-docker
        container: immich-server
        widget:
          type: immich
          url: http://immich-server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
          version: 2
    - Vaultwarden:
        icon: vaultwarden
        href: https://vault.khe.ee
        description: Paroolihaldur
        server: my-docker
        container: vaultwarden
    - Home Assistant:
        icon: home-assistant
        href: https://home.khe.ee
        description: Kodu automaatika
        server: my-docker
        container: homeassistant
    - Trips:
        icon: mdi-map-marker-path
        href: https://trips.khe.ee
        description: Perereiside atlas
        server: my-docker
        container: trips

- Veeb:
    - khe.ee:
        icon: mdi-web
        href: https://khe.ee
        description: Avaleht
        server: my-docker
        container: landing
    - Games:
        icon: mdi-gamepad-variant
        href: https://games.khe.ee
        description: Mängud
        server: my-docker
        container: games
    - Pages:
        icon: mdi-file-document-outline
        href: https://pages.khe.ee
        description: Avaldatud lehed
        server: my-docker
        container: pages
    - Draft:
        icon: dufs
        href: https://draft.khe.ee
        description: Lehtede mustandid
        server: my-docker
        container: draft

- Infra:
    - Proxmox:
        icon: proxmox
        href: https://192.168.0.10:8006
        description: Hypervisor
        server: my-docker
        container: homepage
        widget:
          type: proxmox
          url: https://192.168.0.10:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve
          allowInsecure: true
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
    - AdGuard:
        icon: adguard-home
        href: http://192.168.0.11:8080
        description: DNS ja reklaamiblokk
        server: my-docker
        container: adguard
        widget:
          type: adguard
          url: http://adguard:80
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Uptime Kuma:
        icon: uptime-kuma
        href: https://status.khe.ee
        description: Monitooring
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          # The widget reads a status page; create one with this slug in Kuma.
          slug: homelab
    - Grafana:
        icon: grafana
        href: http://192.168.0.11:3030
        description: Logid ja hoiatused
        server: my-docker
        container: grafana
    - NPM:
        icon: nginx-proxy-manager
        href: http://192.168.0.11:81
        description: Reverse proxy
        server: my-docker
        container: nginx-proxy-manager
