services:
  # Docker socket proxy: autoheal lists containers and restarts them, nothing
  # more. linuxserver's image, not Tecnativa's: docs/operational-notes.md#autoheal.
  autoheal-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.8@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    container_name: autoheal-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:rw,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      # Written out although most are the image's defaults: this proxy holds
      # the socket, and a changed default must not widen it unseen.
      POST: 0
      EVENTS: 0
      EXEC: 0
      BUILD: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
      AUTH: 0
      SECRETS: 0
      LOG_LEVEL: warning
    networks:
      - autoheal-socket
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Autoheal — monitors Docker healthchecks on all containers and restarts
  # any that go "unhealthy". Fills the gap left by `restart: unless-stopped`
  # which only reacts to container *crashes*, not healthcheck failures
  # (e.g. the stuck ML worker that prompted this setup).
  autoheal:
    # 1.2.0 tag's entrypoint requires $DOCKER_SOCK to be a unix-socket FILE
    # (`if [ -e "$DOCKER_SOCK" ]`), which breaks the tcp:// socket-proxy
    # pattern. Digest-only pin avoids this (no tag → digest is authoritative;
    # with :latest+digest some clients silently re-resolve the tag).
    image: willfarrell/autoheal@sha256:cfd35baa26927f2dd56a0cd185425bb7aba2eb116e439f3ee383538355534542
    container_name: autoheal
    restart: unless-stopped
    depends_on:
      autoheal-socket-proxy:
        condition: service_healthy
    environment:
      # Monitor every container with a healthcheck defined. Opt-out via
      # label `autoheal=False` on individual services.
      AUTOHEAL_CONTAINER_LABEL: all
      # Poll docker API every 10s for unhealthy containers.
      AUTOHEAL_INTERVAL: 10
      # autoheal's own delay after it starts, before its first check; there
      # is no per-container grace, so each service's `start_period` is that.
      AUTOHEAL_START_PERIOD: 30
      # Route through the socket proxy instead of mounting docker.sock directly.
      DOCKER_SOCK: tcp://autoheal-socket-proxy:2375
      TZ: Europe/Tallinn
    networks:
      - autoheal-socket
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

networks:
  autoheal-socket:
    driver: bridge
    internal: true  # No external access — only autoheal <-> socket-proxy
