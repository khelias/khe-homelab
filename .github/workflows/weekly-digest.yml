name: Weekly Digest

# The unattended agent tier (estate ADR-027): Claude reads the held Renovate
# PRs, the scheduled jobs' last runs and failed CI on main, and writes one
# digest. Two jobs, so the model never holds a write token: `digest` runs
# Claude with read permissions only and uploads digest.md; `post` runs no
# model, scans the file and opens the issue (scripts/agent-digest-post.sh).
# GitHub-hosted runner only: a run must not reach the homelab.
# Fallback: disable this workflow and revoke the token (claude.ai settings).

on:
  schedule:
    - cron: '0 21 * * 5'   # Friday 21:00 UTC, read on Saturday morning
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Claude writes the digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds CLAUDE_CODE_OAUTH_TOKEN and deploys from main only, so a dispatch
    # from another branch cannot read the secret.
    environment: agent
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    env:
      # Strips the OAuth token from Bash children and runs every command in
      # the Bash sandbox, in its own PID namespace; gh keeps GH_TOKEN.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The action takes the prompt as text, not a file.
      - name: Read the prompt
        id: prompt
        run: |
          delim="PROMPT_$(openssl rand -hex 16)"
          { echo "text<<$delim"; cat .github/agent/weekly-digest.md; echo "$delim"; } >> "$GITHUB_OUTPUT"

      # The sandbox needs bubblewrap and socat, and Ubuntu's AppArmor rule on
      # user namespaces stops bwrap; the rule is lifted for the whole machine,
      # which is thrown away after the job. Ubuntu's bwrap profile still stops
      # the sandbox's seccomp helper (anthropics/claude-code#93130), so the
      # settings below skip that Unix-socket filter, and the Docker socket,
      # the one that would matter on this runner, is closed to the job's user.
      - name: Sandbox tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 600 /var/run/docker.sock

      # Default mode denies whatever the list below does not allow, since a
      # workflow has no one to ask; auto mode would let a review pass more.
      # Reads outside the checkout are blocked, so /proc and the runner's
      # files stay out of reach of the built-in read-only commands. Sandboxed
      # commands reach GitHub only (gh run view --log redirects to blob
      # storage); WebFetch is not sandboxed.
      - name: Claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"permissions": {"blockReadsOutsideWorkingDirectories": true}, "sandbox": {"enabled": true, "failIfUnavailable": true, "network": {"allowAllUnixSockets": true, "allowedDomains": ["github.com", "*.github.com", "*.githubusercontent.com", "*.blob.core.windows.net"]}}}'
          claude_args: >-
            --model sonnet
            --max-turns 40
            --permission-mode default
            --allowedTools "Read,Glob,Grep,WebFetch,Edit(/digest.md),Bash(gh pr list *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh run list *),Bash(gh run view *)"

      # The action's log leaves out the result text, so a failed run would
      # not say why; this prints that text only, never the transcript.
      - name: Why Claude failed
        if: failure()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "no execution file"; exit 0; }
          jq -r '[.. | objects | select(.type? == "result")] | last | {subtype, result, api_error_status} | tostring' "$f" | head -c 2000

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest
          path: digest.md
          if-no-files-found: error
          retention-days: 7

  post:
    name: Scan and post
    needs: digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # gitleaks and the workspace's personal-data rules, pinned there.
      - name: Scan tools
        run: |
          bash scripts/agent-digest-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Download the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest
          path: ${{ runner.temp }}/digest

      - name: Post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PII_RULES: ${{ runner.temp }}/tools/pii-rules.toml
        run: bash scripts/agent-digest-post.sh "$RUNNER_TEMP/digest/digest.md"
