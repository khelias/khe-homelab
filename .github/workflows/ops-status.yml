name: Homelab Status

# Runs the read-only status snapshot now instead of waiting for the 5-min
# timer. The snapshot goes to /var/lib/khe-status/status.log, which Alloy ships
# to Loki, where the agent reads it; this repo is public, so the run log gets
# only the summary. Deliberately has no inputs: a workflow that accepts
# arbitrary commands would just be ssh wearing a different hat.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-status
  cancel-in-progress: true

jobs:
  status:
    name: Read-only health snapshot
    runs-on: [self-hosted, linux, homelab]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect status
        env:
          STATUS_LOG: /var/lib/khe-status/status.log
        run: |
          if [ ! -w "$(dirname "$STATUS_LOG")" ]; then
            echo "::error::$(dirname "$STATUS_LOG") is missing or not writable; run scripts/setup-status-timer.sh on the VM"
            exit 1
          fi
          # Read only what this run appended, so a run that exits early does
          # not show an older run's summary. Rotation starts a new file.
          start=0
          if [ -f "$STATUS_LOG" ]; then start="$(stat -c %s "$STATUS_LOG")"; fi
          rc=0
          ./scripts/homelab-status.sh --log "$STATUS_LOG" || rc=$?
          if [ ! -f "$STATUS_LOG" ] || [ "$(stat -c %s "$STATUS_LOG")" -lt "$start" ]; then start=0; fi
          summary="$(tail -c +"$((start + 1))" "$STATUS_LOG" 2>/dev/null \
            | awk '/^Summary$/ { block = ""; n = 3 } n > 0 { block = block $0 "\n"; n-- } END { printf "%s", block }')"
          if [ -n "$summary" ]; then
            echo "$summary"
          else
            echo "::error::the snapshot wrote no summary (exit ${rc})"
          fi
          exit "$rc"
