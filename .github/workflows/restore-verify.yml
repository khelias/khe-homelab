name: Restore Verify

# Weekly proof that the offsite backup chain actually restores: the newest
# Immich PostgreSQL dump from the latest restic snapshot on R2 goes into a
# throwaway Postgres container and must show its schema. What it covers and
# why is in scripts/restore-verify.sh. A failed or missed run fires the
# Uptime Kuma heartbeat's Telegram alert.

on:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 04:00 UTC, 1h after offsite-backup.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Restore latest immich dump
    runs-on: [self-hosted, linux, homelab]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore + smoke test
        run: ./scripts/restore-verify.sh
